<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#bcd7ed">
<title>Mois actuel — Pharmacie du Libron</title>
<script async src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{
  --blue-glacial:#bcd7ed;--libron-green:#16834f;--libron-green2:#42b77a;--libron-light:#edf9f3;
  --libron-dark:#153d31;--text:#253746;--muted:#657484;
  --pink:#e45b7a;--pink-light:#fff0f4;--pink-border:#f2b5c4;
  --line:#e1e7eb;--bg:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;padding:14px 18px 10px;display:flex;flex-direction:column}
header{height:82px;flex:0 0 82px;display:flex;align-items:center;justify-content:space-between;background:var(--blue-glacial);border-radius:16px;padding:0 16px;margin-bottom:2px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden;background:transparent;border:0}
.logo img{width:100%;height:100%;object-fit:contain}
.title{min-width:0}
h1{font-size:25px;letter-spacing:1.2px;line-height:1;margin:0;font-weight:900;color:var(--libron-dark)}
.sub{font-size:10px;color:var(--muted);margin-top:8px;white-space:nowrap}
.operator{text-align:right;font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.7px}
.operator strong{display:block;font-size:32px;color:var(--text);line-height:1;margin-top:6px}
.period{height:76px;flex:0 0 76px;margin-top:15px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between}
.month{font-size:24px;font-weight:900;color:var(--text);text-transform:uppercase}
.period small{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.5px}
.rate{font-size:27px;font-weight:900;color:var(--pink);background:var(--pink-light);border:1px solid var(--pink-border);border-radius:13px;padding:8px 17px}
.status{text-align:center;font-size:9px;color:var(--muted);min-height:13px;margin:4px 0}
.login{flex:1;display:flex;align-items:center;justify-content:center}
.login-card{width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px 16px;text-align:center;box-shadow:0 5px 18px rgba(21,61,49,.08)}
.login-card b{font-size:15px}.login-card p{font-size:10px;color:var(--muted);margin:7px 0 15px}
.google{border:0;background:var(--blue-glacial);color:var(--text);border-radius:12px;height:43px;padding:0 20px;font-size:11px;font-weight:900}
#productZone{display:none;flex:1;min-height:0;flex-direction:column}
.card{flex:1;min-height:0;background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 5px 18px rgba(21,61,49,.07);display:flex;flex-direction:column}
.name{font-size:23px;font-weight:900;line-height:1.18;color:var(--text);text-transform:uppercase}
.meta{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px}
.line{border-top:2px solid #edf0f2;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{background:#f7f9fa;border-radius:12px;padding:9px;text-align:center}
.stat span{display:block;font-size:9px;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:24px;margin-top:3px}
.stat:nth-child(2) b{color:var(--pink)}.stat:nth-child(3) b{color:var(--libron-green)}
.choices{display:grid;gap:10px;margin-top:13px}
.choice{border:2px solid var(--line);border-radius:17px;background:#fff;min-height:72px;padding:11px 14px;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;color:var(--text)}
.choice .box{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;border:3px solid currentColor}
.choice .txt{font-size:13px;font-weight:900;line-height:1.15}
.choice small{display:block;font-size:10px;margin-top:4px;color:var(--muted);font-weight:500}
.sold{background:var(--pink-light);border-color:var(--pink-border);color:var(--pink)}
.sold .box{background:#fff}
.sold.active{background:#ffe0e8;border-color:var(--pink)}
.remaining{background:var(--libron-light);border-color:#bde4d0;color:var(--libron-green)}
.remaining .box{background:#fff}
.remaining.active{background:#dff4e9;border-color:var(--libron-green)}
.remaining.active small{color:#3f7058}
.step{margin-top:12px}
.step-title{text-align:center;font-size:9px;font-weight:800;color:var(--muted);margin-bottom:4px}
.stepper{display:flex;gap:8px}
.stepper button{width:48px;height:45px;border:0;border-radius:13px;background:var(--libron-green2);color:#fff;font-size:29px;font-weight:900}
.stepper button:disabled{background:#e0e5e8;color:#9da8b0}
.stepper input{flex:1;height:45px;border:2px solid var(--line);border-radius:13px;text-align:center;font-size:22px;font-weight:900;color:var(--text)}
.calc{margin-top:9px;background:#f7f9fa;border-radius:12px;padding:8px;text-align:center;font-size:10px;font-weight:800}.calc b{font-size:14px}
.next{height:58px;flex:0 0 58px;border:0;border-radius:17px;margin-top:12px;background:var(--libron-green2);color:#fff;font-size:15px;font-weight:900;letter-spacing:.2px}
.next:disabled{background:#dfe5e8;color:#98a5ad}
.bottom{height:24px;flex:0 0 24px;display:flex;justify-content:flex-end;align-items:end}
.ref{font-size:10px;font-weight:900;color:var(--muted)}
.message{text-align:center;font-size:9px;color:#c05d6f;height:12px}
@media(max-height:700px){
  .app{padding-top:7px}.card{padding:12px}.name{font-size:19px}.choice{min-height:58px}.period{height:60px;flex-basis:60px}.rate{font-size:22px;padding:6px 13px}
}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand"><div class="logo"><img src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron"></div><div class="title"><h1>Mois actuel</h1><div class="sub">Produits à promouvoir fortement · Pharmacie du Libron</div></div></div>
<div class="operator">Opérateur<strong id="op">—</strong></div>
</header>
<section class="period"><div><div class="month" id="month">—</div><small>MOIS ACTUEL</small></div><div class="rate">50 %</div></section>
<div id="status" class="status">Connexion à Google Sheets nécessaire.</div>
<section id="login" class="login"><div class="login-card"><b>Connexion Google Sheets</b><p>La connexion est nécessaire pour charger et modifier les produits.</p><button class="google" onclick="connectGoogle()">Se connecter à Google</button></div></section>
<section id="productZone">
<div id="card" class="card"></div>
<button id="next" class="next" disabled onclick="goNext()">PRODUIT SUIVANT →</button>
<div class="bottom"><div id="ref" class="ref">Référence 0/0</div></div>
<div id="message" class="message"></div>
</section>
</main>
<script>
const CLIENT_ID='777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID='1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const S1='Feuille1',S2='Feuille2',SCOPES='https://www.googleapis.com/auth/spreadsheets';
let tokenClient,products=[],idx=0,choice=null,remaining=0,operator=localStorage.getItem('zebraOperator')||'—';
document.getElementById('op').textContent=operator;
const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function startMonth(){let d=new Date();return new Date(d.getFullYear(),d.getMonth()+(d.getDate()>=15?1:0),1)}
function dateOf(v){
  if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(),v.getMonth(),1);
  if(typeof v==='number' && isFinite(v)){
    const d=new Date(Date.UTC(1899,11,30)+v*86400000);
    return isNaN(d)?null:new Date(d.getUTCFullYear(),d.getUTCMonth(),1);
  }
  let s=String(v??'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!s)return null;
  let m=s.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.]\d{1,2})?/);
  if(m)return new Date(+m[1],+m[2]-1,1);
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,1);}
  m=s.match(/^(\d{1,2})[-/.](\d{2,4})$/);
  if(m){let y=+m[2];if(y<100)y+=2000;return new Date(y,+m[1]-1,1);}
  const monthsFR={janvier:0,fevrier:1,'février':1,mars:2,avril:3,mai:4,juin:5,juillet:6,aout:7,'août':7,septembre:8,octobre:9,novembre:10,decembre:11,'décembre':11};
  m=s.match(/^(janvier|fevrier|février|mars|avril|mai|juin|juillet|aout|août|septembre|octobre|novembre|decembre|décembre)\s+(\d{2,4})$/);
  if(m){let y=+m[2];if(y<100)y+=2000;return new Date(y,monthsFR[m[1]],1);}
  let d=new Date(s);
  return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),1);
}
function isCurrent(v){let d=dateOf(v),s=startMonth();return d&&d.getFullYear()==s.getFullYear()&&d.getMonth()==s.getMonth()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(t){document.getElementById('status').textContent=t}
function message(t){document.getElementById('message').textContent=t}
document.getElementById('month').textContent=months[startMonth().getMonth()]+' '+startMonth().getFullYear();

async function init(){
  gapi.load('client',async()=>{await gapi.client.init({discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']});
    tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async r=>{
      if(r.error){status('Connexion Google refusée.');return}
      status('Google connecté. Chargement…');await load();
    }});
  });
}
function connectGoogle(){if(tokenClient)tokenClient.requestAccessToken({prompt:''});else status('Google est encore en cours de chargement…')}

async function load(){
 try{
  const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:S1});
  const all=res.result.values||[];products=[];
  all.slice(1).forEach((r,i)=>{
    let q=+r[4]||0,s=+r[6]||0; // Colonne E (Qté) et G (Vendues) décalées de +1
    if(isCurrent(r[1])&&q>s)products.push({r,row:i+2}); // Colonne B (Date) décalée de +1
  });
  products.sort((a,b)=>(dateOf(a.r[1])||0)-(dateOf(b.r[3])||0)||a.row-b.row);
  document.getElementById('login').style.display='none';document.getElementById('productZone').style.display='flex';
  if(!products.length){document.getElementById('card').innerHTML='<div style="margin:auto;text-align:center;color:#657484;font-size:12px;line-height:1.5">Aucun produit trouvé pour <b>'+esc(months[startMonth().getMonth()]+' '+startMonth().getFullYear())+'</b>.<br><small>Structure utilisée : B = Date · C = Produit · D = Code · E = Qté · F = Zone · G = Vendues.</small></div>';document.getElementById('next').disabled=true;document.getElementById('ref').textContent='Référence 0/0';status('Google Sheets connecté.');return}
  const saved=JSON.parse(localStorage.getItem('zebraTrimestreResume')||'null');
  idx=0;if(saved&&saved.operator===operator&&saved.code){let n=products.findIndex(x=>String(x.r[4])===String(saved.code));if(n>=0)idx=n}
  choice=null;remaining=0;render();status('Google Sheets connecté.');
 }catch(e){status('Erreur Google Sheets : '+(e.result?.error?.message||e.message))}
}

function saveResume(){if(products[idx])localStorage.setItem('zebraTrimestreResume',JSON.stringify({operator,code:String(products[idx].r[4]||''),updatedAt:Date.now()}))}
function render(){
 let r=products[idx].r,q=+r[4]||0,soldOld=+r[6]||0,max=Math.max(0,q-soldOld);
 if(choice==='remaining')remaining=Math.max(1,Math.min(max,remaining||max));
 let sold=choice==='sold'?q:(choice==='remaining'?q-remaining:soldOld);
 let rem=choice==='sold'?0:(choice==='remaining'?remaining:max);
 document.getElementById('card').innerHTML=`
 <div class="name">${esc(r[2]||'Produit sans nom')}</div>
 <div class="meta">Date : ${esc(r[1]||'—')} · Code : ${esc(r[3]||'—')} · Zone : ${esc(r[5]||'—')}</div>
 <div class="line"></div>
 <div class="stats"><div class="stat"><span>STOCK</span><b>${q}</b></div><div class="stat"><span>VENDUES</span><b id="sv">${sold}</b></div><div class="stat"><span>RESTANT</span><b id="rv">${rem}</b></div></div>
 <div class="choices">
 <button class="choice sold ${choice==='sold'?'active':''}" onclick="choose('sold')"><span class="box">${choice==='sold'?'✓':''}</span><span class="txt">TOTALEMENT VENDU<small>Transfert dans l'historique au passage suivant</small></span></button>
 <button class="choice remaining ${choice==='remaining'?'active':''}" onclick="choose('remaining')"><span class="box">${choice==='remaining'?'✓':''}</span><span class="txt">PRODUITS RESTANTS<small>Choisir la quantité restante</small></span></button></div>
 <div class="step"><div class="step-title">PRODUITS RESTANTS — − / +</div><div class="stepper"><button onclick="change(-1)" ${choice==='remaining'?'':'disabled'}>−</button><input id="qtyRemain" type="number" min="1" max="${Math.max(1,max)}" value="${choice==='remaining'?remaining:0}" ${choice==='remaining'?'':'disabled'} onchange="inputRemain(this.value)"><button onclick="change(1)" ${choice==='remaining'?'':'disabled'}>+</button></div></div>
 <div class="calc">Vendues = Stock − Restant : <b>${sold}</b></div>`;
 document.getElementById('next').disabled=!(choice==='sold'||choice==='remaining');
 document.getElementById('ref').textContent=`Référence ${idx+1}/${products.length}`;saveResume();
}
function choose(c){let r=products[idx].r,q=+r[4]||0,s=+r[6]||0;choice=c;remaining=c==='remaining'?Math.max(1,q-s):0;render()}
function change(d){if(choice!=='remaining')return;let r=products[idx].r,max=Math.max(1,(+r[4]||0)-(+r[6]||0));remaining=Math.max(1,Math.min(max,remaining+d));render()}
function inputRemain(v){if(choice!=='remaining')return;let r=products[idx].r,max=Math.max(1,(+r[4]||0)-(+r[6]||0));remaining=Math.max(1,Math.min(max,+v||1));render()}
async function updateCell(row,col,value){return gapi.client.sheets.spreadsheets.values.update({spreadsheetId:SPREADSHEET_ID,range:`${S1}!${col}${row}`,valueInputOption:'USER_ENTERED',resource:{values:[[value]]}})}
async function transfer(row){
 const meta=await gapi.client.sheets.spreadsheets.get({spreadsheetId:SPREADSHEET_ID,fields:'sheets.properties(sheetId,title)'});
 const sh=meta.result.sheets||[],f1=sh.find(x=>x.properties.title===S1),f2=sh.find(x=>x.properties.title===S2);if(!f1||!f2)throw Error('Feuille1 ou Feuille2 introuvable.');
 const get=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:`${S1}!A${row}:Z${row}`}),vals=get.result.values?.[0];if(!vals)throw Error('Ligne introuvable.');
 const ap=await gapi.client.sheets.spreadsheets.values.append({spreadsheetId:SPREADSHEET_ID,range:`${S2}!A1`,valueInputOption:'USER_ENTERED',insertDataOption:'INSERT_ROWS',includeValuesInResponse:true,resource:{values:[vals]}});
 if(!ap.result?.updates?.updatedRows)throw Error('Transfert vers Feuille2 non confirmé.');
 await gapi.client.sheets.spreadsheets.batchUpdate({spreadsheetId:SPREADSHEET_ID,resource:{requests:[{deleteDimension:{range:{sheetId:f1.properties.sheetId,dimension:'ROWS',startIndex:row-1,endIndex:row}}}]}})
}
async function goNext(){
 if(!choice)return;let item=products[idx],r=item.r,row=item.row,code=String(r[4]||'');document.getElementById('next').disabled=true;message('Enregistrement…');
 try{
  if(choice==='sold')await transfer(row);else await updateCell(row,'G',Math.max(0,(+r[4]||0)-remaining)); // Colonne G pour les vendues
  localStorage.removeItem('zebraTrimestreResume');
  const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:S1}),all=res.result.values||[];products=[];
  all.slice(1).forEach((rr,i)=>{
    let q=+rr[4]||0,s=+rr[6]||0;
    if(isCurrent(rr[1])&&q>s)products.push({r:rr,row:i+2});
  });
  products.sort((a,b)=>(dateOf(a.r[1])||0)-(dateOf(b.r[3])||0)||a.row-b.row);
  let ni=products.findIndex(x=>String(x.r[4]||'')===code);idx=ni>=0?ni:Math.min(idx,Math.max(0,products.length-1));choice=null;remaining=0;
  if(products.length){render();message('');status('Produit enregistré. Prêt pour le suivant.')}else{document.getElementById('card').innerHTML='<div style="margin:auto;text-align:center;color:#718096;font-size:10px">Tous les produits du mois sont traités. ✓</div>';document.getElementById('ref').textContent='Référence 0/0';message('');status('Tous les produits du mois sont traités.')}
 }catch(e){document.getElementById('next').disabled=false;message('Erreur : '+(e.result?.error?.message||e.message))}
}
window.addEventListener('load',()=>{let n=0,t=setInterval(()=>{n++;if(window.google?.accounts?.oauth2&&window.gapi){clearInterval(t);init()}if(n>100){clearInterval(t);status('Impossible de charger Google.')}},100)})
</script>
</body>
</html>
