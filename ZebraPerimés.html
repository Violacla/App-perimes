<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f1f3">
<title>Suivi Périmés - portatif</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#26384d;--muted:#718096;--blue:#5b8fc9;--blue-dark:#3972ad;--pink:#d99aae;--pink-dark:#c77991;--soft-blue:#e5eff9;--soft-pink:#f7e5eb;--border:#d5e0ec;--shadow:0 5px 18px rgba(62,91,122,.12)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100dvh;display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100dvh;padding:14px 12px 18px}
header{text-align:center;padding:5px 4px 12px}.logo{width:64px;height:64px;margin:0 auto 8px;border-radius:18px;background:linear-gradient(135deg,var(--soft-blue),var(--soft-pink));display:flex;align-items:center;justify-content:center;font-size:31px;box-shadow:var(--shadow)}
h1{margin:0;font-size:21px;letter-spacing:.2px}.subtitle{margin:5px 0 0;color:var(--muted);font-size:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}.panel-title{font-size:15px;font-weight:700;margin-bottom:10px}
.operators{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.operator{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:15px;min-height:62px;font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
.operator small{display:block;font-size:9px;font-weight:400;color:var(--muted);margin-top:2px}.operator.selected{background:var(--blue);border-color:var(--blue);color:#fff}.operator.selected small{color:#fff}
.continue{width:100%;border:0;border-radius:15px;min-height:58px;background:var(--blue-dark);color:#fff;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}.continue:disabled{opacity:.38;cursor:not-allowed}
.choices{display:grid;gap:11px}.choice{width:100%;min-height:132px;border:1px solid var(--border);border-radius:20px;background:#fff;display:grid;grid-template-columns:92px 1fr;align-items:center;gap:16px;padding:14px;text-align:left;color:var(--text);box-shadow:0 3px 10px rgba(62,91,122,.08);cursor:pointer;touch-action:manipulation}
.choice-image{width:92px;height:92px;border-radius:17px;background:linear-gradient(135deg,var(--soft-blue),var(--soft-pink));display:flex;align-items:center;justify-content:center;font-size:38px}.choice h2{margin:0 0 7px;font-size:17px}.choice p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
.choice:active,.operator:active,.continue:active{transform:scale(.97)}.choice{transition:transform .08s ease,box-shadow .08s ease}.choice:active{box-shadow:0 1px 5px rgba(62,91,122,.12)}#home{display:none}.loginMessage{min-height:17px;margin:7px 0;text-align:center;font-size:11px;color:var(--muted)}
.session{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:11px;color:var(--muted)}.change{border:1px solid var(--border);background:#fff;border-radius:9px;padding:6px 9px;font-size:10px}
@media(max-height:650px){.app{padding-top:8px}header{padding-bottom:7px}.logo{width:44px;height:44px;font-size:22px;margin-bottom:5px}h1{font-size:18px}.panel{padding:11px;margin-bottom:8px}.choice{min-height:87px}.choice-image{width:62px;height:62px}}
</style>
</head>
<body>
<main class="app">
<section id="login">
<header><div class="logo">💊</div><h1>Suivi Périmés</h1><p class="subtitle">Interface Zebra</p></header>
<div class="panel">
<div class="panel-title">Choisissez votre opérateur</div>
<div class="operators">
<button class="operator" data-operator="1">1<small>Opérateur 1</small></button>
<button class="operator" data-operator="2">2<small>Opérateur 2</small></button>
<button class="operator" data-operator="3">3<small>Opérateur 3</small></button>
<button class="operator" data-operator="4">4<small>Opérateur 4</small></button>
<button class="operator" data-operator="5">5<small>Opérateur 5</small></button>
<button class="operator" data-operator="6">6<small>Opérateur 6</small></button>
<button class="operator" data-operator="7">7<small>Opérateur 7</small></button>
<button class="operator" data-operator="8">8<small>Opérateur 8</small></button>
<button class="operator" data-operator="9">9<small>Opérateur 9</small></button>
</div>
<div id="loginMessage" class="loginMessage">Sélectionnez votre numéro.</div>
<button id="continueBtn" class="continue" disabled>Continuer</button>
</div>
</section>
<section id="home">
<header><div class="logo">💊</div><h1>Que souhaitez-vous faire ?</h1><p class="subtitle">Choisissez une action</p></header>
<div class="session"><span>Opérateur <strong id="currentOperator">—</strong></span><button class="change" id="changeOperator">Changer</button></div>
<div class="choices">
<button class="choice" id="addProduct"><div class="choice-image">📦</div><div><h2>Ajouter un produit</h2><p>Scanner un produit et l'enregistrer dans le suivi.</p></div></button>
<button class="choice" id="promotions"><div class="choice-image">🏷️</div><div><h2>Gérer les promotions</h2><p>Mettre en promotion ou déclarer les produits totalement vendus.</p></div></button>
<button class="choice" id="removeProducts"><div class="choice-image">🗑️</div><div><h2>Produits à retirer</h2><p>Effectuer un retrait total ou partiel des produits concernés.</p></div></button>
</div>
</section>
</main>
<script>
let selectedOperator=null;
const login=document.getElementById('login'),home=document.getElementById('home'),continueBtn=document.getElementById('continueBtn'),loginMessage=document.getElementById('loginMessage'),currentOperator=document.getElementById('currentOperator');
document.querySelectorAll('.operator').forEach(button=>button.addEventListener('click',()=>{
document.querySelectorAll('.operator').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');selectedOperator=button.dataset.operator;loginMessage.textContent='Opérateur '+selectedOperator+' sélectionné.';continueBtn.disabled=false;
}));
continueBtn.addEventListener('click',()=>{if(!selectedOperator)return;currentOperator.textContent=selectedOperator;login.style.display='none';home.style.display='block';localStorage.setItem('zebraOperator',selectedOperator);});
document.getElementById('changeOperator').addEventListener('click',()=>{home.style.display='none';login.style.display='block';});
document.getElementById('addProduct').addEventListener('click',()=>goTo('zebra-ajouter.html'));
document.getElementById('promotions').addEventListener('click',()=>goTo('TrimestreZebra.html'));
document.getElementById('removeProducts').addEventListener('click',()=>goTo('zebra-retrait.html'));

function goTo(page){
  // Le clic valide immédiatement le choix et conserve l'opérateur.
  localStorage.setItem('zebraOperator', selectedOperator);
  window.location.href = page;
}
</script>
</body>
</html>
