<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bcd7ed">
<title>Ajouter un produit Zebra - Pharmacie du Libron</title>
<script async defer src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{
  --bg:#eaf4fa;--text:#26384d;--muted:#718096;--blue:#5b8fc9;--blue-dark:#3972ad;
  --pink:#d99aae;--pink-dark:#c77991;--pink-soft:#f8e3ea;--blue-soft:#e4f0fa;
  --border:#cbddea;--shadow:0 5px 15px rgba(62,91,122,.12);
  --green:#16834f;--green-soft:#edf9f3
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(145deg,#dceef8 0%,#bcd7ed 48%,#f8edf1 100%);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;padding:6px 10px;display:flex;flex-direction:column;min-height:0}

/* HEADER */
header{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
 background:linear-gradient(135deg,#cfe5f4 0%,#bcd7ed 55%,#dceef8 100%);
 border-radius:12px;padding:0 10px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.logo{width:34px;height:34px;flex:0 0 34px}.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-size:15px;line-height:1;font-weight:900;color:#153d31}
.session{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px;font-size:9px;color:var(--muted);padding:0 2px}
.session strong{color:var(--blue-dark);font-size:11px}
.change{border:1px solid var(--border);background:rgba(255,255,255,.9);border-radius:6px;
 padding:3px 6px;font-size:8px;color:var(--blue-dark);font-weight:800;cursor:pointer}

/* LOGIN */
#login-panel{flex:1;display:flex;align-items:center}
.panel{width:100%;background:rgba(255,255,255,.95);border:1px solid var(--border);
 border-radius:12px;padding:15px 10px;text-align:center;box-shadow:var(--shadow)}
.panel-title{font-size:13px;font-weight:900;color:var(--blue-dark);margin-bottom:8px}
.google{width:100%;height:44px;border:0;border-radius:10px;background:#3972ad;color:#fff;font-size:12px;font-weight:900;cursor:pointer}

/* MAIN ENTRY */
#entry-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}

.scan-box{background:linear-gradient(135deg,#e4f0fa,#f8e3ea);border:1px solid var(--border);
 border-radius:11px;padding:6px;flex:0 0 auto}
.scan-title{font-size:8px;font-weight:900;color:var(--blue-dark);margin-bottom:2px}
#code{width:100%;height:42px;border:2px solid var(--blue);border-radius:8px;background:#fff;
 text-align:center;font-size:22px;font-weight:900;letter-spacing:2px;padding:0}
#code:focus{outline:3px solid rgba(91,143,201,.2)}

/* PRODUCT */
.product-card{background:linear-gradient(135deg,#fff,var(--pink-soft));border:1px solid #e6cbd4;
 border-radius:11px;padding:6px;flex:0 0 auto}
.product-label{font-size:8px;font-weight:900;color:var(--pink-dark);margin-bottom:2px}
.product-name{width:100%;height:32px;border:1px solid #e6cbd4;border-radius:6px;
 background:rgba(255,255,255,.9);font-size:14px;font-weight:900;color:var(--blue-dark);
 padding:0 6px;text-align:center}
#product-hint{font-size:7px;color:var(--muted);margin-top:2px}

/* CONTROLS GRID */
.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:0 0 auto}
.field{background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:10px;padding:5px}
.field-label{font-size:8px;font-weight:900;color:var(--muted);margin-bottom:2px}

.date-control, .qty-control{display:flex;align-items:center;gap:3px;height:36px}
.date-btn, .qty-btn{width:30px;height:36px;flex:0 0 30px;border:0;border-radius:7px;
 background:var(--blue-soft);color:var(--blue-dark);font-size:18px;font-weight:900;cursor:pointer}
.date-value{flex:1;text-align:center;font-size:10px;font-weight:900;color:var(--blue-dark)}
#qty{width:100%;height:36px;border:1px solid var(--border);border-radius:7px;text-align:center;
 font-size:16px;font-weight:900}

/* ZONE PANEL */
.zone-panel{background:#e4f3ff;border:2px solid #9ed8ff;border-radius:11px;padding:6px;flex:0 0 auto;position:relative}
.zone-panel .field-label{color:#1776b5}
#zone{width:100%;height:38px;border:1px solid #8cccf5;border-radius:8px;background:#fff;
 padding:0 8px;font-size:14px;font-weight:900;color:var(--blue-dark);text-align:center}
.autocomplete-list{position:absolute;bottom:100%;left:0;right:0;z-index:50;background:#fff;
 border:1px solid var(--border);border-radius:8px;list-style:none;margin:0 0 3px 0;padding:0;
 max-height:130px;overflow-y:auto;box-shadow:var(--shadow)}
.autocomplete-list li{padding:8px;font-size:12px;font-weight:700;cursor:pointer}
.autocomplete-list li.active,.autocomplete-list li:hover{background:var(--pink-soft);color:var(--pink-dark)}

/* CTA */
.save{width:100%;height:48px;flex:0 0 48px;border:0;border-radius:11px;margin-top:auto;
 background:var(--pink);color:#fff;font-size:14px;font-weight:900;box-shadow:var(--shadow);cursor:pointer}
.save:disabled{opacity:0.4;cursor:not-allowed}
.status{min-height:14px;height:14px;flex:0 0 14px;margin:2px 0 0;text-align:center;
 font-size:9px;font-weight:800;color:var(--blue-dark)}
.back-link{height:12px;flex:0 0 12px;display:block;text-align:center;color:var(--blue-dark);
 text-decoration:none;font-size:8px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo"><img src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron"></div>
    <h1>Ajouter un produit</h1>
  </div>
</header>

<div class="session">
  <span>Opérateur : <strong id="operator-badge">—</strong></span>
  <button class="change" onclick="location.href='ZebraPerimés.html'">Accueil</button>
</div>

<div class="panel" id="login-panel">
  <div class="panel-title">Connexion Google Sheets</div>
  <button class="google" id="btn-login" onclick="initiateGoogleAndOperatorLogin()" disabled>Préparation…</button>
</div>

<div class="panel" id="entry-panel" style="display:none;">
  <div class="scan-box">
    <div class="scan-title">① SCANNER LE CIP</div>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 derniers chiffres">
  </div>

  <div class="product-card">
    <div class="product-label">② NOM DU PRODUIT</div>
    <input id="product" class="product-name" type="text" autocomplete="off" placeholder="Nom du produit">
    <div id="product-hint">Scannez un CIP pour rechercher automatiquement</div>
  </div>

  <div class="controls-grid">
    <div class="field">
      <div class="field-label">③ DATE (Mois/Année)</div>
      <div class="date-control">
        <button type="button" class="date-btn" id="date-prev">‹</button>
        <div class="date-value" id="date-display">—</div>
        <button type="button" class="date-btn" id="date-next">›</button>
      </div>
      <input id="date" type="hidden">
    </div>

    <div class="field">
      <div class="field-label">④ QUANTITÉ</div>
      <div class="qty-control">
        <button type="button" class="qty-btn" id="qty-minus">−</button>
        <input id="qty" type="number" min="1" value="1">
        <button type="button" class="qty-btn" id="qty-plus">+</button>
      </div>
    </div>
  </div>

  <div class="zone-panel">
    <div class="field-label">⑤ ZONE GÉOGRAPHIQUE</div>
    <div class="zone-wrap">
      <input id="zone" type="text" autocomplete="off" placeholder="Tapez ou cherchez la zone...">
      <ul class="autocomplete-list" id="zone-suggestions" style="display:none;"></ul>
    </div>
  </div>

  <button class="save" id="btn-add" onclick="addRowToSheet()" disabled>AJOUTER LE PRODUIT</button>
</div>

<div id="status" class="status"></div>
<a href="ZebraPerimés.html" class="back-link">← Retour à ZebraPérimés</a>
</div>

<script>
const CLIENT_ID='777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID='1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE='Feuille1';
const SCOPES='https://www.googleapis.com/auth/spreadsheets';

const zones = [
  "aboca","aderma","arko","aromat","avene","bain","bande","bébé",
  "bien etre","bioderma","bi-oil","bonbon","brumes et senteurs","cerave",
  "circulation","clearskin","collagene","coloration","confort","conseil",
  "cooper geo","cosmeto","dentaire","deo","dermato","dexeryl","dietetique",
  "douleurs","durex","enfants","forme","frigo","homeo","hydratis","intime",
  "la roche posay","LRP","la rosee","levres et mains","moustik",
  "noreva","nutergia","nuxe","ongles","oreille","pieds et mains","pileje",
  "poux","ronflement","cheveux","corps","STUP","svr","tisanes","uriage",
  "nature","vichy","yeux","1ersoins","4patte"
];

let tokenClient=null,gapiReady=false,gisReady=false,accessToken=null;
let operatorName=localStorage.getItem('zebraOperator')||null;

function setStatus(t){document.getElementById('status').textContent=t||'';}

function updateOperator(){
  document.getElementById('operator-badge').textContent=operatorName||'—';
}

function formatLast6(v){
  return String(v||'').replace(/\D/g,'').slice(-6);
}

function waitForGoogle(){
  let tries=0;
  const timer=setInterval(()=>{
    if(window.gapi && !gapiReady){
      gapi.load('client',async()=>{
        try{
          await gapi.client.init({discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']});
          gapiReady=true; maybeReady();
        }catch(e){setStatus('Impossible de charger Google Sheets.');}
      });
    }
    if(window.google?.accounts?.oauth2 && !gisReady){
      try{
        tokenClient=google.accounts.oauth2.initTokenClient({
          client_id:CLIENT_ID,
          scope:SCOPES,
          callback:(resp)=>{
            if(!resp || !resp.access_token){
              setStatus('Connexion Google annulée.');
              return;
            }
            accessToken=resp.access_token;
            operatorName=localStorage.getItem('zebraOperator')||operatorName||'—';
            updateOperator();
            document.getElementById('login-panel').style.display='none';
            document.getElementById('entry-panel').style.display='flex';
            setStatus('✓ Google Sheets connecté.');
            setTimeout(()=>document.getElementById('code').focus(),100);
          }
        });
        gisReady=true; maybeReady();
      }catch(e){setStatus('Erreur Google Identity : '+e.message);}
    }
    tries++;
    if(gapiReady&&gisReady){clearInterval(timer);}
    if(tries>150&&!gapiReady){clearInterval(timer);setStatus('Google Sheets n’a pas pu être chargé.');}
  },100);
}

function maybeReady(){
  if(gapiReady&&gisReady){
    const b=document.getElementById('btn-login');
    b.disabled=false;
    b.textContent='Se connecter à Google';
    updateOperator();
    if(!operatorName) setStatus('Choisissez d’abord un opérateur sur l’accueil.');
    else setStatus('Google Sheets prêt.');
  }
}

function initiateGoogleAndOperatorLogin(){
  operatorName=localStorage.getItem('zebraOperator')||operatorName;
  if(!operatorName){
    setStatus('Aucun opérateur sélectionné.');
    return;
  }
  if(!tokenClient||!gisReady){
    setStatus('Google n’est pas prêt…');
    return;
  }
  setStatus('Connexion Google en cours…');
  try{
    tokenClient.requestAccessToken({prompt:''});
  }catch(e){
    setStatus('Erreur : '+e.message);
  }
}

function initZoneAutocomplete(){
  const input=document.getElementById('zone'),list=document.getElementById('zone-suggestions');
  let currentFocus=-1;
  input.addEventListener('input',()=>{
    const val=input.value.toLowerCase().trim();
    list.innerHTML='';currentFocus=-1;
    if(!val){list.style.display='none';validateAdd();return;}
    zones.filter(z=>z.toLowerCase().includes(val)).forEach(z=>{
      const li=document.createElement('li');li.textContent=z;
      li.onclick=()=>{input.value=z;list.style.display='none';validateAdd();};
      list.appendChild(li);
    });
    list.style.display=list.children.length?'block':'none';
    validateAdd();
  });
  input.addEventListener('keydown',e=>{
    const items=list.querySelectorAll('li');if(!items.length)return;
    if(e.key==='ArrowDown'){currentFocus=(currentFocus+1)%items.length;}
    else if(e.key==='ArrowUp'){currentFocus=(currentFocus-1+items.length)%items.length;}
    else if(e.key==='Enter'&&currentFocus>=0){e.preventDefault();items[currentFocus].click();return;}
    items.forEach(x=>x.classList.remove('active'));if(items[currentFocus])items[currentFocus].classList.add('active');
  });
  document.addEventListener('click',e=>{if(!input.contains(e.target)&&!list.contains(e.target))list.style.display='none';});
}

async function findProduct(code){
  document.getElementById('btn-add').disabled=true;
  document.getElementById('product').value='Recherche…';
  try{
    for(const sheet of ['Feuille1','Feuille2']){
      const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:sheet});
      const rows=res.result.values||[];
      for(let i=1;i<rows.length;i++){
        const sheetCode=formatLast6(rows[i][3]||'');
        if(sheetCode===code){
          document.getElementById('product').value=rows[i][2]||'';
          const z=zones.find(x=>x.toLowerCase()===String(rows[i][5]||'').trim().toLowerCase())||'';
          document.getElementById('zone').value=z;
          document.getElementById('product-hint').textContent='Produit trouvé dans l’historique ✓';
          validateAdd();
          setStatus('Produit reconnu !');
          document.getElementById('qty').focus();
          document.getElementById('qty').select();
          return;
        }
      }
    }
    document.getElementById('product').value='';
    document.getElementById('zone').value='';
    document.getElementById('product-hint').textContent='Nouveau CIP — Saisissez le nom manuellement';
    validateAdd();
    setStatus('Nouveau produit : entrez son nom.');
    document.getElementById('product').focus();
  }catch(e){
    document.getElementById('product').value='';
    document.getElementById('product-hint').textContent='Saisie manuelle requise';
    validateAdd();
    setStatus('Recherche impossible, saisissez le nom.');
  }
}

const codeInput=document.getElementById('code');
codeInput.addEventListener('input',()=>{
  const c=formatLast6(codeInput.value);
  if(c.length===6 && accessToken){ findProduct(c); }
});
codeInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const c=formatLast6(codeInput.value);
    if(c.length===6 && accessToken){ findProduct(c); }
  }
});

function validateAdd(){
  const q=parseInt(document.getElementById('qty').value,10);
  const d=document.getElementById('date').value.trim();
  const z=zones.find(x=>x.toLowerCase()===document.getElementById('zone').value.trim().toLowerCase());
  const productName=document.getElementById('product').value.trim();
  const codeValid=/^\d{6}$/.test(document.getElementById('code').value);
  document.getElementById('btn-add').disabled=!(operatorName && accessToken && codeValid && productName && q>0 && /^\d{2}\/\d{4}$/.test(d) && z);
}

document.getElementById('qty-minus').onclick=()=>{const q=document.getElementById('qty');q.value=Math.max(1,(parseInt(q.value)||1)-1);validateAdd();};
document.getElementById('qty-plus').onclick=()=>{const q=document.getElementById('qty');q.value=(parseInt(q.value)||1)+1;validateAdd();};
document.getElementById('product').oninput=validateAdd;
document.getElementById('qty').oninput=validateAdd;

let selectedMonth=new Date().getMonth()+1;
let selectedYear=new Date().getFullYear();
const monthNames=['JANV.','FÉVR.','MARS','AVR.','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];
function renderDate(){
  const m=String(selectedMonth).padStart(2,'0');
  document.getElementById('date').value=m+'/'+selectedYear;
  document.getElementById('date-display').textContent=monthNames[selectedMonth-1]+' '+selectedYear;
  validateAdd();
}
function shiftMonth(delta){
  selectedMonth+=delta;
  if(selectedMonth<1){selectedMonth=12;selectedYear--;}
  if(selectedMonth>12){selectedMonth=1;selectedYear++;}
  renderDate();
}
document.getElementById('date-prev').onclick=()=>shiftMonth(-1);
document.getElementById('date-next').onclick=()=>shiftMonth(1);
renderDate();

async function addRowToSheet(){
  const btn=document.getElementById('btn-add');
  if(btn.disabled) return;
  const code=formatLast6(document.getElementById('code').value);
  const product=document.getElementById('product').value.trim();
  const date=document.getElementById('date').value.trim();
  const qty=parseInt(document.getElementById('qty').value,10);
  const zone=zones.find(x=>x.toLowerCase()===document.getElementById('zone').value.trim().toLowerCase());
  
  if(!/^\d{6}$/.test(code)||!product||!zone||qty<1||!/^\d{2}\/\d{4}$/.test(date)){
    setStatus('Vérifiez les champs du formulaire.');
    return;
  }
  
  const [m,y]=date.split('/');
  const lastDay=new Date(Number(y),Number(m),0).getDate();
  const dateVal=`${y}-${m}-${lastDay}`;
  const now=new Date().toLocaleString('fr-FR');
  const values=[[operatorName,dateVal,product,code,qty,zone,'',0,now]];
  
  btn.disabled=true; btn.textContent='ENREGISTREMENT…';
  try{
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId:SPREADSHEET_ID,
      range:RANGE,
      valueInputOption:'USER_ENTERED',
      resource:{values}
    });
    setStatus('✓ Produit ajouté avec succès !');
    
    // Reset pour le scan suivant
    document.getElementById('code').value='';
    document.getElementById('product').value='';
    document.getElementById('product-hint').textContent='Scannez un CIP pour rechercher automatiquement';
    document.getElementById('zone').value='';
    document.getElementById('qty').value=1;
    btn.textContent='AJOUTER LE PRODUIT';
    setTimeout(()=>document.getElementById('code').focus(),50);
  }catch(e){
    btn.disabled=false; btn.textContent='AJOUTER LE PRODUIT';
    setStatus('Erreur d’enregistrement : '+(e.result?.error?.message||e.message));
  }
}

window.addEventListener('load',()=>{
  updateOperator();
  initZoneAutocomplete();
  waitForGoogle();
});
</script>
</body>
</html>
