<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#bcd7ed">
<title>Trimestre Zebra — Pharmacie du Libron</title>
<style>
:root{
  --blue-glacial:#bcd7ed;
  --libron-green:#16834f;
  --libron-green2:#42b77a;
  --libron-light:#edf9f3;
  --libron-dark:#153d31;
  --text:#253746;
  --muted:#657484;
  --pink:#e45b7a;
  --pink-light:#fff0f4;
  --pink-border:#f2b5c4;
  --line:#e1e7eb;
  --bg:#fff;
  --shadow:0 5px 18px rgba(21,61,49,.08);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;min-height:100%;background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;color:var(--text)
}
body{display:flex;justify-content:center}
.app{
  width:100%;max-width:560px;min-height:100dvh;
  padding:14px 18px 18px;display:flex;flex-direction:column
}
header{
  height:82px;flex:0 0 82px;display:flex;align-items:center;
  justify-content:space-between;background:var(--blue-glacial);
  border-radius:16px;padding:0 16px;margin-bottom:16px
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.title{min-width:0}
h1{
  font-size:25px;letter-spacing:1.1px;line-height:1;
  margin:0;font-weight:900;color:var(--libron-dark)
}
.sub{
  font-size:10px;color:var(--muted);margin-top:8px;
  white-space:nowrap
}
.operator{
  text-align:right;font-size:10px;color:var(--muted);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.7px
}
.operator strong{
  display:block;font-size:32px;color:var(--text);
  line-height:1;margin-top:6px
}
.back{
  width:100%;height:52px;flex:0 0 52px;
  border:2px solid var(--line);border-radius:17px;
  background:#fff;color:var(--text);font-size:14px;font-weight:900;
  margin-bottom:16px;cursor:pointer
}
.intro{
  margin:0 2px 13px;font-size:11px;color:var(--muted);
  text-align:left
}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.month-card,.info-card{
  width:100%;min-height:108px;border:2px solid var(--line);
  border-radius:20px;background:#fff;padding:15px;
  display:flex;align-items:center;gap:14px;text-align:left;
  box-shadow:var(--shadow);cursor:pointer;color:var(--text);
  transition:transform .08s ease
}
.month-card:active,.info-card:active{transform:scale(.99)}
.icon{
  width:48px;height:48px;flex:0 0 48px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:900
}
.card-text{min-width:0;flex:1}
.card-label{
  font-size:10px;font-weight:900;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted)
}
.card-title{
  font-size:20px;font-weight:900;line-height:1.05;
  margin:4px 0 6px
}
.card-rule{font-size:12px;font-weight:800}
.card-arrow{font-size:22px;font-weight:900;color:var(--muted)}
.current{background:var(--pink-light);border-color:var(--pink-border)}
.current .icon{background:#ffe0e8;color:var(--pink)}
.current .card-rule{color:var(--pink)}
.plus1{background:#fffaf0;border-color:#f0d9ae}
.plus1 .icon{background:#fff0cf;color:#b26a00}
.plus1 .card-rule{color:#b26a00}
.plus2{background:var(--libron-light);border-color:#bde4d0}
.plus2 .icon{background:#dff4e9;color:var(--libron-green)}
.plus2 .card-rule{color:var(--libron-green)}
.explain{background:#f4f8fc;border-color:#c9d9e8}
.explain .icon{background:#e3eef8;color:#3972ad}
.explain .card-rule{color:#3972ad}
.footer{
  margin-top:auto;padding-top:18px;text-align:center;
  font-size:9px;color:var(--muted)
}
@media(max-width:380px){
  .app{padding:10px 12px 14px}
  header{padding:0 11px}
  h1{font-size:21px}.sub{font-size:9px}
  .logo{width:52px;height:52px;flex-basis:52px}
  .operator strong{font-size:28px}
  .card-title{font-size:18px}
}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="brand">
    <div class="logo">
      <img src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron">
    </div>
    <div class="title">
      <h1>Trimestre Zebra</h1>
      <div class="sub">Gestion des promotions · Pharmacie du Libron</div>
    </div>
  </div>
  <div class="operator">Opérateur<strong id="op">—</strong></div>
</header>

<button class="back" onclick="location.href='ZebraPerimés.html'">← Retour au menu Zebra</button>

<p class="intro">Choisissez la période à traiter ou consultez les explications des promotions.</p>

<section class="cards">

  <button class="month-card current" onclick="location.href='TrimestreZebra_MoisActuel.html'">
    <div class="icon">🏷️</div>
    <div class="card-text">
      <div class="card-label">Mois actuel</div>
      <div class="card-title" id="m0">—</div>
      <div class="card-rule">50 à 70 % · Promotion forte</div>
    </div>
    <div class="card-arrow">→</div>
  </button>

  <button class="month-card plus1" onclick="location.href='TrimestreZebra_MoisPlus1.html'">
    <div class="icon">📅</div>
    <div class="card-text">
      <div class="card-label">Mois +1</div>
      <div class="card-title" id="m1">—</div>
      <div class="card-rule">10 à 30 % · Promotion anticipée</div>
    </div>
    <div class="card-arrow">→</div>
  </button>

  <button class="month-card plus2" onclick="location.href='TrimestreZebra_MoisPlus2.html'">
    <div class="icon">⭐</div>
    <div class="card-text">
      <div class="card-label">Mois +2</div>
      <div class="card-title" id="m2">—</div>
      <div class="card-rule">Mise en avant · Préparation</div>
    </div>
    <div class="card-arrow">→</div>
  </button>

  <button class="info-card explain" onclick="location.href='ExplicationPromotion.html'">
    <div class="icon">💡</div>
    <div class="card-text">
      <div class="card-label">Information</div>
      <div class="card-title">Explication Promotion</div>
      <div class="card-rule">Comprendre la logique des 3 mois</div>
    </div>
    <div class="card-arrow">→</div>
  </button>

</section>

<div class="footer">Pharmacie du Libron · Trimestre Zebra</div>
</main>

<script>
const operator=localStorage.getItem('zebraOperator')||'—';
document.getElementById('op').textContent=operator;

function startMonth(){
  const d=new Date();
  return new Date(d.getFullYear(), d.getMonth()+(d.getDate()>=15?1:0),1);
}
function addMonths(d,n){
  return new Date(d.getFullYear(),d.getMonth()+n,1);
}
function label(d){
  return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
}
const s=startMonth();
document.getElementById('m0').textContent=label(addMonths(s,0));
document.getElementById('m1').textContent=label(addMonths(s,1));
document.getElementById('m2').textContent=label(addMonths(s,2));
</script>
</body>
</html>
