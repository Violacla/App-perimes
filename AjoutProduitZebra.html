<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bcd7ed">
<title>Ajouter un produit Zebra - Pharmacie du Libron</title>
<script async defer src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{
  --bg:#eaf4fa;--text:#26384d;--muted:#718096;--blue:#5b8fc9;--blue-dark:#3972ad;
  --pink:#d99aae;--pink-dark:#c77991;--pink-soft:#f8e3ea;--blue-soft:#e4f0fa;
  --border:#cbddea;--shadow:0 5px 15px rgba(62,91,122,.12);
  --green:#16834f;--green-soft:#edf9f3
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;
 background:linear-gradient(145deg,#dceef8 0%,#bcd7ed 48%,#f8edf1 100%);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;padding:5px 9px 5px;display:flex;flex-direction:column;min-height:0}

/* HEADER */
header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;
 background:linear-gradient(135deg,#cfe5f4 0%,#bcd7ed 55%,#dceef8 100%);
 border-radius:14px;padding:0 10px;margin-bottom:5px}
.brand{display:flex;align-items:center;gap:7px;min-width:0}
.logo{width:38px;height:38px;flex:0 0 38px}.logo img{width:100%;height:100%;object-fit:contain}
.title{min-width:0}
h1{margin:0;font-size:17px;line-height:1;font-weight:900;color:#153d31}
.subtitle{margin:4px 0 0;font-size:7.5px;color:var(--muted);white-space:nowrap}
.session{display:flex;align-items:center;gap:7px;margin:0 0 5px;font-size:8px;color:var(--muted)}
.session strong{color:var(--blue-dark);font-size:12px}
.change{border:1px solid var(--border);background:rgba(255,255,255,.85);border-radius:8px;
 padding:4px 7px;font-size:8px;color:var(--blue-dark);font-weight:800}

/* LOGIN */
#login-panel{flex:1;display:flex;align-items:center}
.panel{width:100%;background:rgba(255,255,255,.93);border:1px solid var(--border);
 border-radius:15px;padding:10px;box-shadow:var(--shadow)}
.panel-title{font-size:12px;font-weight:900;color:var(--blue-dark);text-align:center;margin-bottom:7px}
.google{width:100%;height:40px;border:0;border-radius:10px;background:#3972ad;color:#fff;font-size:11px;font-weight:900}

/* MAIN ENTRY — one screen, no scrolling */
#entry-panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.step{font-size:7.5px;color:var(--muted);font-weight:900;margin:0 0 3px 2px;letter-spacing:.3px}
.scan-box{background:linear-gradient(135deg,#e4f0fa,#f8e3ea);border:1px solid var(--border);
 border-radius:13px;padding:7px;margin-bottom:5px;flex:0 0 auto}
.scan-title{font-size:8px;font-weight:900;color:var(--blue-dark);text-align:center;margin-bottom:3px}
#code{width:100%;height:43px;border:2px solid var(--blue);border-radius:9px;background:#fff;
 text-align:center;font-size:20px;font-weight:900;letter-spacing:1px;padding:0}
#code:focus{outline:3px solid rgba(91,143,201,.18)}

/* PRODUCT */
.product-card{background:linear-gradient(135deg,#fff,var(--pink-soft));border:1px solid #e6cbd4;
 border-radius:12px;padding:6px;margin-bottom:5px;flex:0 0 auto}
.product-label{font-size:7.5px;font-weight:900;color:var(--pink-dark);margin-bottom:2px}
.product-name{width:100%;height:30px;border:1px solid transparent;border-radius:7px;
 background:rgba(255,255,255,.75);font-size:15px;font-weight:900;color:var(--blue-dark);
 padding:0 5px;text-align:center}
.product-name:focus{outline:2px solid rgba(217,154,174,.4);border-color:#e6cbd4}
#product-hint{font-size:7px!important;margin-top:2px!important}

/* 3 compact controls in one row */
.quick-row{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:5px;flex:0 0 auto;margin-bottom:5px}
.field{background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:10px;padding:5px;min-width:0}
.field-label{font-size:7px;font-weight:900;color:var(--muted);margin-bottom:3px;white-space:nowrap}
.date-control,.qty-control{display:flex;align-items:center;gap:3px;height:33px}
.date-btn,.qty-btn{width:28px;height:33px;flex:0 0 28px;border:0;border-radius:7px;
 background:var(--blue-soft);color:var(--blue-dark);font-size:17px;font-weight:900}
.date-value{flex:1;text-align:center;font-size:9px;font-weight:900;color:var(--blue-dark);white-space:nowrap}
#qty{width:100%;height:33px;border:1px solid var(--border);border-radius:7px;padding:0;text-align:center;
 font-size:14px;font-weight:900}
#qty:focus{outline:2px solid rgba(91,143,201,.18)}

/* ZONE — large and obvious */
.zone-panel{background:#e4f3ff;border:2px solid #9ed8ff;border-radius:11px;padding:6px;
 flex:0 0 auto;margin-bottom:5px}
.zone-panel .field-label{color:#1776b5}
.zone-wrap{position:relative}
#zone{width:100%;height:38px;border:1px solid #8cccf5;border-radius:8px;background:#fff;
 padding:0 8px;font-size:13px;font-weight:900;color:var(--blue-dark);text-align:center}
#zone:focus{outline:3px solid rgba(91,143,201,.15)}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;z-index:50;background:#fff;
 border:1px solid var(--border);border-radius:8px;list-style:none;margin:2px 0 0;padding:0;
 max-height:110px;overflow-y:auto}
.autocomplete-list li{padding:8px;font-size:11px;font-weight:700}
.autocomplete-list li.active,.autocomplete-list li:hover{background:var(--pink-soft);color:var(--pink-dark)}

/* CTA */
.save{width:100%;height:45px;flex:0 0 45px;border:0;border-radius:11px;margin-top:auto;
 background:var(--pink);color:#fff;font-size:13px;font-weight:900;box-shadow:var(--shadow)}
.save:disabled{opacity:.38}
.status{min-height:12px;height:12px;flex:0 0 12px;margin:2px 0 0;text-align:center;
 font-size:8px;font-weight:800;color:var(--blue-dark)}
.back-link{height:10px;flex:0 0 10px;display:block;text-align:center;color:var(--blue-dark);
 text-decoration:none;font-size:7px;font-weight:800}

@media(max-height:650px){
 .app{padding-top:3px}
 header{height:45px;flex-basis:45px}
 .logo{width:35px;height:35px;flex-basis:35px}
 h1{font-size:16px}
 #code{height:39px}
 .product-name{height:28px}
 .date-control,.qty-control,#qty,.date-btn,.qty-btn{height:30px}
 .zone-panel{padding:5px}
 #zone{height:35px}
 .save{height:42px;flex-basis:42px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><img src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron"></div>
  <h1>Ajouter un produit</h1>
  <p class="subtitle">Interface Zebra</p>
</header>

<div class="session">
  <span>Opérateur <strong id="operator-badge">—</strong></span>
  <button class="change" onclick="location.href='ZebraPerimés.html'">Accueil</button>
</div>

<div class="panel" id="login-panel">
  <div class="panel-title">Connexion Google Sheets</div>
  <button class="google" id="btn-login" onclick="initiateGoogleAndOperatorLogin()" disabled>Préparation…</button>
</div>

<div class="panel" id="entry-panel" style="display:none;">
  <div class="scan-box">
    <div class="scan-title">① SCANNER LE CIP</div>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 derniers chiffres">
  </div>

  <div class="product-card">
    <div class="product-label">② PRODUIT</div>
    <input id="product" class="product-name" type="text" autocomplete="off"
           placeholder="Nom du produit">
    <div id="product-hint">Scannez un CIP pour rechercher le produit</div>
  </div>

  <div class="quick-row">
    <div class="field">
      <div class="field-label">③ DATE</div>
      <div class="date-control">
        <button type="button" class="date-btn" id="date-prev">‹</button>
        <div class="date-value" id="date-display">—</div>
        <button type="button" class="date-btn" id="date-next">›</button>
      </div>
      <input id="date" type="hidden">
    </div>

    <div class="field">
      <div class="field-label">④ QUANTITÉ</div>
      <div class="qty-control">
        <button type="button" class="qty-btn" id="qty-minus">−</button>
        <input id="qty" type="number" min="1" value="1">
        <button type="button" class="qty-btn" id="qty-plus">+</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">⑤ ZONE</div>
      <div class="zone-wrap">
        <input id="zone" type="text" autocomplete="off" placeholder="Zone">
        <ul class="autocomplete-list" id="zone-suggestions" style="display:none;"></ul>
      </div>
    </div>
  </div>

  <button class="save" id="btn-add" onclick="addRowToSheet()" disabled>AJOUTER</button>
</div>

<pre id="status" class="status"> class="status"></pre>
<a href="ZebraPerimés.html" class="back-link">← Retour à ZebraPérimés</a>
</div>
<script>
const CLIENT_ID='777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID='1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE='Feuille1';
const SCOPES='https://www.googleapis.com/auth/spreadsheets';

const zones = [
  "aboca","aderma","arko","aromat","avene","bain","bande","bébé",
  "bien etre","bioderma","bi-oil","bonbon","brumes et senteurs","cerave",
  "circulation","clearskin","collagene","coloration","confort","conseil",
  "cooper geo","cosmeto","dentaire","deo","dermato","dexeryl","dietetique",
  "douleurs","durex","enfants","forme","frigo","homeo","hydratis","intime",
  "la roche posay","LRP","la rosee","levres et mains","moustik",
  "noreva","nutergia","nuxe","ongles","oreille","pieds et mains","pileje",
  "poux","ronflement","cheveux","corps","STUP","svr","tisanes","uriage",
  "nature","vichy","yeux","1ersoins","4patte"
];

let tokenClient=null,gapiReady=false,gisReady=false,accessToken=null;
let operatorName=localStorage.getItem('zebraOperator')||null;
let productFound=false;

function setStatus(t){document.getElementById('status').textContent=t||'';}

function updateOperator(){
  document.getElementById('operator-badge').textContent=operatorName||'—';
}

function formatLast6(v){
  return String(v||'').replace(/\D/g,'').slice(-6);
}

function waitForGoogle(){
  let tries=0;
  const timer=setInterval(()=>{
    if(window.gapi && !gapiReady){
      gapi.load('client',async()=>{
        try{
          await gapi.client.init({discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']});
          gapiReady=true; maybeReady();
        }catch(e){setStatus('Impossible de charger Google Sheets.');}
      });
    }
    if(window.google?.accounts?.oauth2 && !gisReady){
      try{
        tokenClient=google.accounts.oauth2.initTokenClient({
          client_id:CLIENT_ID,
          scope:SCOPES,
          callback:(resp)=>{
            if(!resp || !resp.access_token){
              setStatus('Connexion Google annulée.');
              return;
            }
            accessToken=resp.access_token;
            operatorName=localStorage.getItem('zebraOperator')||operatorName||'—';
            updateOperator();
            document.getElementById('login-panel').style.display='none';
            document.getElementById('entry-panel').style.display='block';
            setStatus('✓ Google Sheets connecté.');
            setTimeout(()=>document.getElementById('code').focus(),100);
          }
        });
        gisReady=true; maybeReady();
      }catch(e){setStatus('Erreur Google Identity : '+e.message);}
    }
    tries++;
    if(gapiReady&&gisReady){clearInterval(timer);}
    if(tries>150&&!gapiReady){clearInterval(timer);setStatus('Google Sheets n’a pas pu être chargé. Vérifiez Internet.');}
  },100);
}

function maybeReady(){
  if(gapiReady&&gisReady){
    const b=document.getElementById('btn-login');
    b.disabled=false;
    b.textContent='Se connecter à Google';
    updateOperator();
    if(!operatorName) setStatus('Retournez à ZebraPérimés pour choisir l’opérateur.');
    else setStatus('Google Sheets prêt.');
  }
}

function initiateGoogleAndOperatorLogin(){
  operatorName=localStorage.getItem('zebraOperator')||operatorName;
  if(!operatorName){
    setStatus('Aucun opérateur sélectionné. Retournez à ZebraPérimés.');
    return;
  }
  if(!tokenClient||!gisReady){
    setStatus('Google n’est pas encore prêt…');
    return;
  }
  setStatus('Ouverture de la connexion Google…');
  try{
    tokenClient.requestAccessToken({prompt:''});
  }catch(e){
    console.error(e);
    setStatus('Erreur de connexion Google : '+e.message);
  }
}

function initZoneAutocomplete(){
  const input=document.getElementById('zone'),list=document.getElementById('zone-suggestions');
  let currentFocus=-1;
  input.addEventListener('input',()=>{
    const val=input.value.toLowerCase().trim();
    list.innerHTML='';currentFocus=-1;
    if(!val){list.style.display='none';return;}
    zones.filter(z=>z.toLowerCase().includes(val)).forEach(z=>{
      const li=document.createElement('li');li.textContent=z;
      li.onclick=()=>{input.value=z;document.getElementById('zone-display').textContent=z;list.style.display='none';validateAdd();};
      list.appendChild(li);
    });
    list.style.display=list.children.length?'block':'none';
  });
  input.addEventListener('keydown',e=>{
    const items=list.querySelectorAll('li');if(!items.length)return;
    if(e.key==='ArrowDown'){currentFocus=(currentFocus+1)%items.length;}
    else if(e.key==='ArrowUp'){currentFocus=(currentFocus-1+items.length)%items.length;}
    else if(e.key==='Enter'&&currentFocus>=0){e.preventDefault();items[currentFocus].click();return;}
    else return;
    items.forEach(x=>x.classList.remove('active'));items[currentFocus].classList.add('active');e.preventDefault();
  });
  document.addEventListener('click',e=>{if(!input.contains(e.target)&&!list.contains(e.target))list.style.display='none';});
}

async function findProduct(code){
  productFound=false;
  document.getElementById('btn-add').disabled=true;
  document.getElementById('product').value='Recherche…';
  try{
    for(const sheet of ['Feuille1','Feuille2']){
      const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:sheet});
      const rows=res.result.values||[];
      for(let i=1;i<rows.length;i++){
        const sheetCode=formatLast6(rows[i][3]||'');
        if(sheetCode===code){
          document.getElementById('product').value=rows[i][2]||'';
          const z=zones.find(x=>x.toLowerCase()===String(rows[i][5]||'').trim().toLowerCase())||'';
          document.getElementById('zone').value=z;
          document.getElementById('zone-display').textContent=z||'—';
          productFound=true;
          document.getElementById('product-hint').textContent='Produit reconnu — nom modifiable si besoin';
          validateAdd();
          setStatus('Produit trouvé ✓');
          document.getElementById('qty').focus();
          document.getElementById('qty').select();
          return;
        }
      }
    }
    document.getElementById('product').value='';
    document.getElementById('zone-display').textContent='—';
    document.getElementById('zone').value='';
    document.getElementById('product-hint').textContent='Nouveau CIP — saisissez le nom du produit ci-dessus';
    productFound=true;
    validateAdd();
    setStatus('Nouveau CIP : saisissez le nom du produit.');
  }catch(e){
    console.error(e);
    document.getElementById('product').value='';
    document.getElementById('product-hint').textContent='Saisissez le nom du produit si le CIP est nouveau';
    productFound=true;
    validateAdd();
    setStatus('Recherche impossible — vous pouvez saisir le nom manuellement.');
  }
}

const codeInput=document.getElementById('code');
codeInput.addEventListener('input',()=>{setTimeout(()=>{const c=formatLast6(codeInput.value);codeInput.value=c;if(c.length===6&&accessToken)findProduct(c);},0);});
codeInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const c=formatLast6(codeInput.value);codeInput.value=c;if(c.length===6&&accessToken)findProduct(c);}});
codeInput.addEventListener('blur',()=>{const c=formatLast6(codeInput.value);codeInput.value=c;if(c.length===6&&accessToken)findProduct(c);});

function validateAdd(){
  const q=parseInt(document.getElementById('qty').value,10);
  const d=document.getElementById('date').value.trim();
  const z=zones.find(x=>x.toLowerCase()===document.getElementById('zone').value.trim().toLowerCase());
  const productName=document.getElementById('product').value.trim();
  document.getElementById('btn-add').disabled=!(operatorName&&accessToken&&/^\d{6}$/.test(document.getElementById('code').value)&&productName&&q>0&&/^\d{2}\/\d{4}$/.test(d)&&z);
}

document.getElementById('qty-minus').onclick=()=>{const q=document.getElementById('qty');q.value=Math.max(1,(parseInt(q.value)||1)-1);validateAdd();};
document.getElementById('qty-plus').onclick=()=>{const q=document.getElementById('qty');q.value=(parseInt(q.value)||1)+1;validateAdd();};
document.getElementById('product').oninput=()=>{productFound=!!document.getElementById('product').value.trim();validateAdd();};
document.getElementById('qty').oninput=validateAdd;
document.getElementById('date').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,6);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v;validateAdd();};

let selectedMonth=new Date().getMonth()+1;
let selectedYear=new Date().getFullYear();
const monthNames=['JANV.','FÉVR.','MARS','AVR.','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];
function renderDate(){
  const m=String(selectedMonth).padStart(2,'0');
  document.getElementById('date').value=m+'/'+selectedYear;
  document.getElementById('date-display').textContent=monthNames[selectedMonth-1]+' '+selectedYear;
  validateAdd();
}
function shiftMonth(delta){
  selectedMonth+=delta;
  if(selectedMonth<1){selectedMonth=12;selectedYear--;}
  if(selectedMonth>12){selectedMonth=1;selectedYear++;}
  renderDate();
}
document.getElementById('date-prev').onclick=()=>shiftMonth(-1);
document.getElementById('date-next').onclick=()=>shiftMonth(1);
renderDate();

async function addRowToSheet(){
  if(document.getElementById('btn-add').disabled)return;
  const code=formatLast6(document.getElementById('code').value);
  const product=document.getElementById('product').value.trim();
  const date=document.getElementById('date').value.trim();
  const qty=parseInt(document.getElementById('qty').value,10);
  const zone=zones.find(x=>x.toLowerCase()===document.getElementById('zone').value.trim().toLowerCase());
  if(!/^\d{6}$/.test(code)||!product||!zone||qty<1||!/^\d{2}\/\d{4}$/.test(date)){setStatus('Vérifiez les informations.');return;}
  const [m,y]=date.split('/');
  const lastDay=new Date(Number(y),Number(m),0).getDate();
  const dateVal=`${y}-${m}-${lastDay}`;
  const now=new Date().toLocaleString('fr-FR');
  const values=[[operatorName,dateVal,product,code,qty,zone,'',0,now]];
  const btn=document.getElementById('btn-add');btn.disabled=true;btn.textContent='AJOUT…';
  try{
    await gapi.client.sheets.spreadsheets.values.append({spreadsheetId:SPREADSHEET_ID,range:RANGE,valueInputOption:'USER_ENTERED',resource:{values}});
    setStatus('✓ Produit ajouté');
    document.getElementById('code').value='';
    document.getElementById('product').value='';
    document.getElementById('product-hint').textContent='Scannez un CIP pour rechercher le produit';
    document.getElementById('zone').value='';
    document.getElementById('zone-display').textContent='—';
    document.getElementById('qty').value=1;
    document.getElementById('date').value=todayMY();
    productFound=false;
    btn.textContent='AJOUTER';btn.disabled=true;
    setTimeout(()=>document.getElementById('code').focus(),80);
  }catch(e){
    console.error(e);
    btn.disabled=false;btn.textContent='AJOUTER';
    setStatus('Erreur Google Sheets : '+(e.result?.error?.message||e.message));
  }
}

window.addEventListener('load',()=>{
  updateOperator();
  initZoneAutocomplete();
  waitForGoogle();
});
</script>
</body>
</html>
