<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=227, height=416, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f7fb">
<title>Trimestre Zebra — Mois actuel</title>
<style>
:root{
 --bg:#f4f7fb;--card:#fff;--text:#26384d;--muted:#718096;
 --blue:#5b8fc9;--blue-dark:#3972ad;--pink:#d99aae;--green:#86bf8e;
 --soft-blue:#e5eff9;--soft-pink:#f7e5eb;--soft-green:#eef8ef;
 --border:#d5e0ec;--disabled:#d9e0e8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{display:flex;justify-content:center;align-items:flex-start}
.app{width:6cm;height:11cm;min-width:6cm;max-width:6cm;min-height:11cm;max-height:11cm;padding:4px;overflow:hidden}
header{text-align:center;padding:1px 0 3px}
.logo{width:25px;height:25px;margin:0 auto 2px;border-radius:7px;background:linear-gradient(135deg,var(--soft-blue),var(--soft-pink));display:flex;align-items:center;justify-content:center;font-size:13px}
h1{margin:0;font-size:13px;line-height:1.1;color:#163f5b}
.subtitle{margin:2px 0 1px;font-size:7px;color:var(--muted)}
.session{font-size:7px;color:var(--muted);text-align:center;margin-bottom:3px}
.session strong{color:var(--text)}
.topbar{margin-bottom:3px}
.back{width:100%;height:24px;border:1px solid var(--border);background:#fff;border-radius:7px;color:var(--text);font-size:8px;font-weight:800}
.panel{background:#fff;border:1px solid var(--border);border-radius:9px;padding:5px;box-shadow:0 2px 7px rgba(62,91,122,.08)}
.panel-head{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font-size:9px}
.count{font-size:7px;color:var(--muted)}
.login{text-align:center;border:1px solid var(--border);border-radius:7px;padding:8px 4px;margin-top:4px;background:#f8fbff}
#status{font-size:8px;line-height:1.2;color:var(--muted)}
.login button{margin-top:5px;height:25px;padding:0 10px;border:0;border-radius:8px;background:var(--blue-dark);color:#fff;font-size:8px;font-weight:800}
#productArea{display:none;margin-top:4px}
.product{background:#fff;border:1px solid var(--border);border-radius:8px;padding:5px}
.product-title{font-size:11px;font-weight:900;line-height:1.15}
.code{font-size:8px;color:var(--blue-dark);font-weight:800;margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:4px}
.fact{background:#f7f9fc;border-radius:5px;padding:3px}
.fact span{display:block;font-size:6px;color:var(--muted)}
.fact strong{display:block;font-size:9px;line-height:1.1}
.choices{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.choice{width:100%;height:28px;border:1.5px solid var(--border);border-radius:7px;background:#fff;color:var(--text);text-align:left;padding:3px 6px;font-size:8px;font-weight:900;cursor:pointer;display:block}
.choice small{display:block;font-size:6px;font-weight:600;color:var(--muted)}
.choice.active{border-color:var(--green);background:var(--soft-green)}
.stepper-title{font-size:7px;text-transform:uppercase;color:var(--muted);font-weight:900;margin-top:4px;text-align:center}
.stepper{display:flex;align-items:center;gap:4px;margin-top:2px;width:100%}
.stepper button{width:32px;height:29px;min-width:32px;border:0;border-radius:7px;background:var(--green);color:#fff;font-size:19px;line-height:1;font-weight:900}
.stepper button:disabled{background:#cfd7e1;color:#9aa6b3;opacity:1}
.stepper input{flex:1;width:100%;height:29px;border:1px solid var(--border);border-radius:7px;background:#fff;text-align:center;font-size:13px;font-weight:900;color:var(--text)}
.next{width:100%;height:29px;margin-top:5px;border:0;border-radius:7px;background:var(--blue-dark);color:#fff;font-size:8px;font-weight:900}
.next:disabled{background:var(--disabled);color:#9aa6b3}
.fixed-ref{font-size:6.5px;color:var(--muted);font-weight:800;text-align:right;margin-top:2px;padding-right:2px}
.message{font-size:7px;color:var(--muted);text-align:center;margin-top:1px;min-height:7px}
</style>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
<main class="app">
<header>
  <div class="logo">🏷️</div>
  <h1 id="pageTitle">Mois actuel</h1>
  <p class="subtitle">Produits à promouvoir fortement</p>
</header>
<div class="session">Opérateur : <strong id="operator">—</strong></div>
<div class="topbar"><button class="back" onclick="location.href='TrimestreZebra.html'">← Trimestre</button></div>

<section class="panel">
  <div class="panel-head">
    <h2 id="monthTitle">Connexion Google</h2>
    <span class="count" id="count"></span>
  </div>

  <div id="googleLogin" class="login">
    <div id="status">Connexion à Google Sheets nécessaire.</div>
    <button id="googleLoginBtn" onclick="connectGoogle()" disabled>Se connecter à Google</button>
  </div>

  <div id="productArea">
    <article id="product" class="product"></article>
  </div>
</section>
</main>

<script>
const CLIENT_ID='777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID='1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE='Feuille1';
const SCOPES='https://www.googleapis.com/auth/spreadsheets';
const PAGE_TYPE=0;

let tokenClient=null,gapiInited=false,gisInited=false,sheetRows=[];
let currentProducts=[],currentIndex=0,decision=null,remainingQty=0;

document.getElementById('operator').textContent=localStorage.getItem('zebraOperator')||'—';

function status(t){document.getElementById('status').textContent=t}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatCode(v){const s=String(v??'').replace(/\D/g,'');return s?s.padStart(6,'0'):''}

function monthStart(){
 const d=new Date();let y=d.getFullYear(),m=d.getMonth();
 if(d.getDate()>=15){m++;if(m===12){m=0;y++}}
 return {y,m}
}
function addMonths(y,m,n){const d=new Date(y,m+n,1);return {y:d.getFullYear(),m:d.getMonth()}}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
function classifyDate(v){
 if(!v)return null;let y,m,mat=String(v).trim().match(/^(\d{4})-(\d{2})/);
 if(mat){y=+mat[1];m=+mat[2]-1}else{const d=new Date(v);if(isNaN(d))return null;y=d.getFullYear();m=d.getMonth()}
 const s=monthStart();return (y-s.y)*12+(m-s.m)
}
function updateLabels(){
 const s=monthStart(),x=addMonths(s.y,s.m,0);
 document.getElementById('monthTitle').textContent=monthLabel(x.y,x.m)+' — 50 à 70 %';
 document.getElementById('pageTitle').textContent='Mois actuel';
}

function gapiLoaded(){gapi.load('client',async()=>{try{
 await gapi.client.init({discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']});
 gapiInited=true;ready();
}catch(e){status('Erreur Google API : '+e.message)}})}
function gisLoaded(){
 tokenClient=google.accounts.oauth2.initTokenClient({
  client_id:CLIENT_ID,scope:SCOPES,
  callback:async r=>{
   if(r.error){status('Connexion Google refusée.');return}
   status('Google Sheets connecté. Chargement…');
   document.getElementById('googleLogin').style.display='none';
   await loadSheet();
  }
 });
 gisInited=true;ready();
}
function ready(){
 const b=document.getElementById('googleLoginBtn');
 if(gapiInited&&gisInited)b.disabled=false;
}
function connectGoogle(){
 if(!tokenClient||!gapiInited){status('Google est encore en cours de chargement…');return}
 tokenClient.requestAccessToken({prompt:'consent'});
}

async function loadSheet(){
 try{
  const res=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:RANGE});
  sheetRows=res.result.values||[];
  document.getElementById('productArea').style.display='block';
  renderProducts();
  resumeIfPossible();
 }catch(e){
  document.getElementById('googleLogin').style.display='block';
  status('Erreur Google Sheets : '+e.message);
 }
}
function productRows(){
 const a=[];
 for(let i=1;i<sheetRows.length;i++){
  const r=sheetRows[i],c=classifyDate(r[1]);
  if(c===PAGE_TYPE)a.push({r,row:i+1});
 }
 return a;
}
function renderProducts(){
 currentProducts=productRows();
 const count=document.getElementById('count');
 count.textContent=currentProducts.length+' produit'+(currentProducts.length>1?'s':'');
 if(!currentProducts.length){
  document.getElementById('product').innerHTML='<div class="message">Aucun produit à traiter.</div>';
  return;
 }
 if(currentIndex>=currentProducts.length)currentIndex=0;
 const item=currentProducts[currentIndex],r=item.r;
 const stock=Number(r[4]||0),oldSold=Number(r[6]||0),oldRemaining=Math.max(0,stock-oldSold);
 const promo=r[7]||0;
 document.getElementById('product').innerHTML=`
  <div class="product-title">${esc(r[2]||'Produit sans nom')}</div>
  <div class="code">${formatCode(r[3])}</div>
  <div class="facts">
   <div class="fact"><span>ZONE</span><strong>${esc(r[5]||'—')}</strong></div>
   <div class="fact"><span>STOCK</span><strong id="stockValue">${stock}</strong></div>
   <div class="fact"><span>VENDUES</span><strong id="soldValue">${oldSold}</strong></div>
   <div class="fact"><span>PRODUITS RESTANTS</span><strong id="remainingValue">${oldRemaining}</strong></div>
   <div class="fact"><span>PROMO</span><strong>${esc(promo)} %</strong></div>
   <div class="fact"><span>RÉFÉRENCE</span><strong>${formatCode(r[3])||'—'}</strong></div>
  </div>
  <div class="choices">
   <button class="choice ${decision==='sold'?'active':''}" onclick="chooseDecision('sold')">
    ✓ TOTALEMENT VENDU
    <small>Restant = 0 · Vendues = Stock</small>
   </button>
   <button class="choice ${decision==='remaining'?'active':''}" onclick="chooseDecision('remaining')">
    📦 PRODUITS RESTANTS
    <small>Le nombre restant sera choisi avec − / +</small>
   </button>
  </div>
  <div class="stepper-title">Produits restants — choisir avec − / +</div>
  <div class="stepper">
   <button id="minusBtn" onclick="changeRemaining(-1)" disabled>−</button>
   <input id="remainingInput" type="number" min="1" max="${oldRemaining}" value="${decision==='remaining'?remainingQty:0}" disabled>
   <button id="plusBtn" onclick="changeRemaining(1)" disabled>+</button>
  </div>
  <button id="nextBtn" class="next" onclick="goNextProduct()" disabled>PRODUIT SUIVANT →</button>
  <div class="fixed-ref" id="fixedRef">Référence 1/${currentProducts.length}</div>
  <div id="message" class="message"></div>
 `;
 const fixedRef=document.getElementById('fixedRef');
 if(fixedRef) fixedRef.textContent=`Référence ${currentIndex+1}/${currentProducts.length}`;
 document.getElementById('remainingInput').addEventListener('input',e=>{
  if(decision!=='remaining')return;
  remainingQty=Math.max(1,Math.min(oldRemaining,Number(e.target.value)||1));
  updateCalculated();
 });
 updateCalculated();
}
function updateCalculated(){
 if(!currentProducts.length)return;
 const r=currentProducts[currentIndex].r;
 const stock=Number(r[4]||0);
 const oldSold=Number(r[6]||0);
 const maxRemaining=Math.max(0,stock-oldSold);

 let rem=oldSold>stock?0:(decision==='sold'?0:(decision==='remaining'?remainingQty:maxRemaining));
 if(decision==='remaining') rem=Math.max(1,Math.min(maxRemaining||1,remainingQty||1));
 const sold=Math.max(0,stock-rem);

 const sv=document.getElementById('soldValue'),rv=document.getElementById('remainingValue');
 if(sv)sv.textContent=sold;
 if(rv)rv.textContent=rem;

 const active=decision==='remaining' && maxRemaining>0;
 const m=document.getElementById('minusBtn'),p=document.getElementById('plusBtn');
 const i=document.getElementById('remainingInput'),n=document.getElementById('nextBtn');

 if(m)m.disabled=!active;
 if(p)p.disabled=!active;
 if(i){
   i.disabled=!active;
   i.min='1';
   i.max=String(Math.max(1,maxRemaining));
   i.value=decision==='remaining'?rem:0;
 }
 if(n)n.disabled=!(decision==='sold'||active);

 const soldChoice=document.querySelector('.choice:first-of-type');
 const remainingChoice=document.querySelector('.choice:nth-of-type(2)');
 if(soldChoice)soldChoice.classList.toggle('active',decision==='sold');
 if(remainingChoice)remainingChoice.classList.toggle('active',decision==='remaining');
}
function chooseDecision(kind){
 decision=kind;
 const r=currentProducts[currentIndex].r;
 const stock=Number(r[4]||0);
 const oldSold=Number(r[6]||0);
 const maxRemaining=Math.max(0,stock-oldSold);

 if(kind==='remaining'){
   if(maxRemaining<=0){
     decision=null;
     const msg=document.getElementById('message');
     if(msg)msg.textContent='Aucun produit restant pour cet article.';
     updateCalculated();
     return;
   }
   remainingQty=Math.max(1,Math.min(maxRemaining,maxRemaining));
 }else{
   remainingQty=0;
 }
 updateCalculated();
 saveResume();
}
function changeRemaining(delta){
 if(decision!=='remaining')return;
 const r=currentProducts[currentIndex].r;
 const stock=Number(r[4]||0);
 const oldSold=Number(r[6]||0);
 const max=Math.max(0,stock-oldSold);
 if(max<=0)return;
 remainingQty=Math.max(1,Math.min(max,remainingQty+delta));
 updateCalculated();
 saveResume();
}
function saveResume(){
 try{
  const r=currentProducts[currentIndex]?.r||[];
  localStorage.setItem('zebraTrimestreResume',JSON.stringify({barcode:String(r[3]||''),row:currentProducts[currentIndex]?.row,type:PAGE_TYPE,decision,remainingQty}));
 }catch(e){}
}
function resumeIfPossible(){
 try{
  const x=JSON.parse(localStorage.getItem('zebraTrimestreResume')||'null');
  if(!x||x.type!==PAGE_TYPE)return;
  const idx=currentProducts.findIndex(p=>String(p.r[3]||'')===x.barcode);
  if(idx>=0){
   currentIndex=idx;decision=x.decision||null;remainingQty=Number(x.remainingQty)||0;renderProducts();
   const msg=document.getElementById('message');if(msg)msg.textContent='Reprise sur le produit en cours.';
  }
 }catch(e){}
}
async function updateCell(row,col,value){
 await gapi.client.sheets.spreadsheets.values.update({
  spreadsheetId:SPREADSHEET_ID,range:`Feuille1!${col}${row}`,
  valueInputOption:'USER_ENTERED',resource:{values:[[value]]}
 });
}
async function archiveCurrentRow(row){
 const meta=await gapi.client.sheets.spreadsheets.get({
   spreadsheetId:SPREADSHEET_ID,
   fields:'sheets.properties(sheetId,title)'
 });
 const sheets=meta.result.sheets||[];
 const f1=sheets.find(x=>x.properties.title==='Feuille1');
 const f2=sheets.find(x=>x.properties.title==='Feuille2');
 if(!f1||!f2)throw new Error('Feuille1 ou Feuille2 introuvable.');

 const got=await gapi.client.sheets.spreadsheets.values.get({
   spreadsheetId:SPREADSHEET_ID,
   range:`Feuille1!A${row}:Z${row}`
 });
 const values=got.result.values?.[0];
 if(!values)throw new Error('Ligne introuvable.');

 await gapi.client.sheets.spreadsheets.values.append({
   spreadsheetId:SPREADSHEET_ID,
   range:'Feuille2!A1',
   valueInputOption:'USER_ENTERED',
   insertDataOption:'INSERT_ROWS',
   resource:{values:[values]}
 });

 await gapi.client.sheets.spreadsheets.batchUpdate({
   spreadsheetId:SPREADSHEET_ID,
   resource:{requests:[{deleteDimension:{
     range:{sheetId:f1.properties.sheetId,dimension:'ROWS',
            startIndex:row-1,endIndex:row}
   }}]}
 });
}

async function goNextProduct(){
 if(!decision||!currentProducts[currentIndex])return;

 const item=currentProducts[currentIndex],r=item.r,row=item.row;
 const next=document.getElementById('nextBtn');
 const message=document.getElementById('message');
 next.disabled=true;

 try{
   const stock=Number(r[4]||0);

   if(decision==='sold'){
     // Totalement vendu : Feuille1 -> Feuille2 Historique, puis suppression.
     await archiveCurrentRow(row);
   }else{
     // Produits restants : la ligne reste dans Feuille1.
     // Vendues = Stock - Restant.
     const sold=Math.max(0,stock-remainingQty);
     await updateCell(row,'G',sold);
   }

   localStorage.removeItem('zebraTrimestreResume');

   // Relecture Google Sheets pour afficher l'état réel.
   await loadSheet();

   currentIndex=0;
   decision=null;
   remainingQty=0;
   renderProducts();

 }catch(e){
   next.disabled=false;
   if(message)message.textContent='Erreur : '+e.message;
 }
}
updateLabels();
window.addEventListener('load',()=>{gapiLoaded();gisLoaded()});
</script>
</body>
</html>
