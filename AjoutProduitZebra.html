<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bcd7ed">
<title>Ajouter un produit Zebra - Pharmacie du Libron</title>
<script async defer src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{
  --bg:#bcd7ed;--text:#26384d;--muted:#5f7289;--blue:#5b8fc9;--blue-dark:#3972ad;
  --pink:#d99aae;--pink-dark:#b9647f;--pink-soft:#f8e3ea;--blue-soft:#e4f0fa;
  --border:#cbddea;--ok:#2f8f6b;--shadow:0 4px 12px rgba(62,91,122,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;gap:6px;min-height:0;
 padding:calc(6px + env(safe-area-inset-top,0px)) 10px calc(6px + env(safe-area-inset-bottom,0px))}

/* HEADER */
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
 background:#cfe5f4;border:1.5px solid var(--border);border-radius:12px;padding:6px 10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:34px;height:34px;flex:0 0 34px}.logo img{width:100%;height:100%;object-fit:contain}
.brand-text{min-width:0}
h1{margin:0;font-size:15px;line-height:1.15;font-weight:900;color:#153d31;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op{font-size:11px;color:var(--muted)}.op strong{color:var(--blue-dark)}
.change{flex:0 0 auto;border:1.5px solid var(--border);background:#fff;border-radius:8px;
 padding:8px 12px;font-size:12px;color:var(--blue-dark);font-weight:800;cursor:pointer}

/* LOGIN */
#login-panel{flex:0 0 auto;margin:auto 0;display:flex;flex-direction:column;gap:10px}
.panel{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;box-shadow:var(--shadow)}
.panel-title{font-size:15px;font-weight:900;color:var(--blue-dark)}
.google{width:100%;height:48px;border:0;border-radius:10px;background:var(--blue-dark);color:#fff;font-size:14px;font-weight:900;cursor:pointer}
.google:disabled{opacity:.6}

/* SAISIE */
#entry-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.field-group{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:11px;font-weight:900;color:var(--blue-dark);letter-spacing:.3px;margin-left:2px}
input,select,button{font-family:inherit}
#code{width:100%;height:46px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--text);
 text-align:center;font-size:18px;font-weight:900;letter-spacing:1px;padding:0 8px}
.product-name{width:100%;height:44px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
 font-size:16px;font-weight:900;color:var(--blue-dark);padding:0 8px;text-align:center}
#code:focus,.product-name:focus,#zone:focus,#qty:focus,.date-select:focus{outline:3px solid rgba(91,143,201,.3)}
#product-hint{font-size:11px;color:var(--muted);margin-left:2px;min-height:14px}
#product-hint.ok{color:var(--ok);font-weight:800}
#date-src{color:var(--ok);font-weight:800;margin-left:4px}

.row-dual{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.date-select{height:44px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
 font-size:14px;font-weight:900;color:var(--blue-dark);text-align:center;text-align-last:center;padding:0}
.qty-control{display:flex;align-items:center;gap:4px;height:44px}
.qty-btn{width:40px;height:44px;flex:0 0 40px;border:1.5px solid var(--border);border-radius:10px;
 background:var(--blue-soft);color:var(--blue-dark);font-size:22px;font-weight:900;cursor:pointer;padding:0}
.qty-btn:active{background:var(--border)}
#qty{width:100%;min-width:0;height:44px;border:1.5px solid var(--border);border-radius:10px;text-align:center;
 font-size:17px;font-weight:900;color:var(--text);padding:0;-moz-appearance:textfield}
#qty::-webkit-inner-spin-button,#qty::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* ZONES : liste toujours visible */
.zone-group{flex:1;min-height:90px;display:flex;flex-direction:column;gap:4px}
#zone{flex:0 0 40px;width:100%;height:40px;border:2px solid var(--blue);border-radius:10px;background:#fff;
 padding:0 10px;font-size:15px;font-weight:900;color:var(--blue-dark);text-align:center}
.zone-grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-wrap:wrap;
 align-content:flex-start;gap:6px;padding:8px;background:rgba(255,255,255,.6);border:1.5px solid var(--border);border-radius:10px}
.chip{border:1.5px solid var(--border);background:#fff;color:var(--blue-dark);border-radius:999px;
 padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer}
.chip:active{transform:scale(.96)}
.chip.sel{background:var(--pink-dark);border-color:var(--pink-dark);color:#fff}
.zone-empty{width:100%;text-align:center;font-size:12px;color:var(--muted);padding:10px}

/* ACTIONS */
.actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.table-btn{height:50px;border:1.5px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue-dark);
 font-size:13px;font-weight:900;cursor:pointer}
.table-btn:active{transform:scale(.98)}
.save{height:50px;border:0;border-radius:10px;background:var(--pink-dark);color:#fff;font-size:14px;font-weight:900;
 box-shadow:var(--shadow);cursor:pointer}
.save:disabled{opacity:.45;cursor:not-allowed;background:#8d9aa8}
.status{flex:0 0 auto;min-height:16px;text-align:center;font-size:12px;font-weight:800;color:var(--blue-dark)}
.back-link{flex:0 0 auto;display:block;text-align:center;color:var(--blue-dark);text-decoration:none;font-size:11px;font-weight:800;padding:2px 0}

/* TABLEAU (Excel) */
.modal{position:fixed;inset:0;background:rgba(21,61,49,.48);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal-card{width:100%;max-width:430px;max-height:92dvh;background:#fff;border-radius:14px;padding:10px;
 box-shadow:0 12px 35px rgba(21,61,49,.25);display:flex;flex-direction:column;gap:8px}
.modal-head{display:flex;align-items:center;justify-content:space-between;font-weight:900;color:var(--blue-dark);font-size:14px}
.modal-close{border:0;background:#eef5fa;border-radius:8px;width:40px;height:36px;font-size:20px;font-weight:900;cursor:pointer}
.table-wrap{overflow:auto;max-height:70dvh;border:1px solid var(--border);border-radius:9px}
#sheet-table{width:100%;border-collapse:collapse;font-size:11px}
#sheet-table th,#sheet-table td{padding:7px 6px;border-bottom:1px solid #edf0f2;text-align:left;white-space:nowrap}
#sheet-table th{position:sticky;top:0;background:#e4f0fa;color:var(--blue-dark);font-weight:900}
#sheet-table tr:last-child td{border-bottom:0}
.empty-table{padding:15px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo"><img src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron"></div>
    <div class="brand-text">
      <h1>Ajouter un produit</h1>
      <div class="op">Opérateur : <strong id="operator-badge">—</strong></div>
    </div>
  </div>
  <button class="change" onclick="location.href='ZebraPerimés.html'">Accueil</button>
</header>

<div class="panel" id="login-panel">
  <div class="panel-title">Connexion Google Sheets</div>
  <button class="google" id="btn-login" onclick="initiateGoogleAndOperatorLogin()" disabled>Chargement de Google…</button>
</div>

<div id="entry-panel" style="display:none;">
  <div class="field-group">
    <div class="field-label">① SCANNER LE DATA MATRIX / CIP</div>
    <input id="code" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scannez le Data Matrix…">
    <div id="product-hint">CIP et date lus automatiquement — ou saisissez 6 chiffres</div>
  </div>

  <div class="field-group">
    <div class="field-label" style="color:var(--pink-dark);">② NOM DU PRODUIT</div>
    <input id="product" class="product-name" type="text" autocomplete="off" placeholder="Nom du produit">
  </div>

  <div class="row-dual">
    <div class="field-group">
      <div class="field-label">③ PÉREMPTION<span id="date-src"></span></div>
      <div class="date-row">
        <select id="select-month" class="date-select">
          <option value="01">Janv.</option><option value="02">Févr.</option><option value="03">Mars</option>
          <option value="04">Avril</option><option value="05">Mai</option><option value="06">Juin</option>
          <option value="07">Juil.</option><option value="08">Août</option><option value="09">Sept.</option>
          <option value="10">Oct.</option><option value="11">Nov.</option><option value="12">Déc.</option>
        </select>
        <select id="select-year" class="date-select"></select>
      </div>
      <input id="date" type="hidden">
    </div>
    <div class="field-group">
      <div class="field-label">④ QUANTITÉ</div>
      <div class="qty-control">
        <button type="button" class="qty-btn" id="qty-minus" aria-label="Moins">−</button>
        <input id="qty" type="number" inputmode="numeric" min="1" value="1">
        <button type="button" class="qty-btn" id="qty-plus" aria-label="Plus">+</button>
      </div>
    </div>
  </div>

  <div class="zone-group">
    <div class="field-label" style="color:#1776b5;">⑤ ZONE GÉOGRAPHIQUE</div>
    <input id="zone" type="text" autocomplete="off" placeholder="Touchez une zone ou tapez pour filtrer…">
    <div class="zone-grid" id="zone-grid"></div>
  </div>

  <div class="actions">
    <button type="button" class="table-btn" id="view-table-btn" onclick="openTable()">📊 VOIR TABLEAU</button>
    <button class="save" id="btn-add" onclick="addRowToSheet()" disabled>AJOUTER LE PRODUIT</button>
  </div>
</div>

<div class="modal" id="table-modal">
  <div class="modal-card">
    <div class="modal-head"><span>Feuille1 — derniers produits ajoutés</span><button class="modal-close" type="button" onclick="closeTable()">×</button></div>
    <div class="table-wrap"><div id="table-content" class="empty-table">Chargement…</div></div>
  </div>
</div>

<div id="status" class="status"></div>
<a href="ZebraPerimés.html" class="back-link">← Retour à ZebraPérimés</a>
</div>

<script>
const CLIENT_ID='777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID='1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE='Feuille1';
const SCOPES='https://www.googleapis.com/auth/spreadsheets';

const zones = [
  "aboca","aderma","arko","aromat","avene","bain","bande","bébé",
  "bien etre","bioderma","bi-oil","bonbon","brumes et senteurs","cerave",
  "circulation","clearskin","collagene","coloration","confort","conseil",
  "cooper geo","cosmeto","dentaire","deo","dermato","dexeryl","dietetique",
  "douleurs","durex","enfants","forme","frigo","homeo","hydratis","intime",
  "la roche posay","LRP","la rosee","levres et mains","moustik",
  "noreva","nutergia","nuxe","ongles","oreille","pieds et mains","pileje",
  "poux","ronflement","cheveux","corps","STUP","svr","tisanes","uriage",
  "nature","vichy","yeux","1ersoins","4patte"
];

let tokenClient=null,gapiReady=false,gisReady=false,accessToken=null,codeReader=null,scannerStream=null,scannerControls=null;
let operatorName=localStorage.getItem('zebraOperator')||null;

function setStatus(t){document.getElementById('status').textContent=t||'';}
function updateOperator(){document.getElementById('operator-badge').textContent=operatorName||'—';}
function parseGS1DataMatrix(raw){
  const out={gtin:'',cip:'',expiry:'',lot:'',serial:''};
  const s=String(raw||'').replace(/^\]d2/i,'').replace(/\u001d/g,'|').trim();
  let exp='';
  if(s.includes('(')){
    // Format lisible : (01)...(17)...(10)...(21)...
    const g=s.match(/\(01\)(\d{14})/),e=s.match(/\(17\)(\d{6})/),l=s.match(/\(10\)([^(|]+)/),n=s.match(/\(21\)([^(|]+)/);
    if(g)out.gtin=g[1];if(e)exp=e[1];if(l)out.lot=l[1];if(n)out.serial=n[1];
  }else{
    // Format brut : lecture séquentielle des identifiants (01 puis 17 puis 10 / 21).
    const p=s.search(/01\d{14}/);
    let rest=p>=0?s.slice(p):'',m;
    while(rest){
      rest=rest.replace(/^\|+/,'');
      if((m=rest.match(/^01(\d{14})/))){out.gtin=m[1];rest=rest.slice(16);}
      else if((m=rest.match(/^17(\d{6})/))){exp=m[1];rest=rest.slice(8);}
      else if((m=rest.match(/^11(\d{6})/))){rest=rest.slice(8);}
      else if((m=rest.match(/^10([^|]*)/))){out.lot=m[1];rest=rest.slice(2+m[1].length);}
      else if((m=rest.match(/^21([^|]*)/))){out.serial=m[1];rest=rest.slice(2+m[1].length);}
      else break;
    }
  }
  if(out.gtin)out.cip=out.gtin.slice(-6);
  if(exp){
    const mm=exp.slice(2,4),yy=Number(exp.slice(0,2));
    if(Number(mm)>=1&&Number(mm)<=12)out.expiry={month:mm,year:String(2000+yy)};
  }
  return out;
}

function formatLast6(v){
  const parsed=parseGS1DataMatrix(v);
  if(parsed.cip) return parsed.cip;
  return String(v||'').replace(/\D/g,'').slice(-6);
}

function setDate(m,y){
  const ys=document.getElementById('select-year');
  if(![...ys.options].some(o=>o.value===String(y))){
    ys.add(new Option(y,y));
    [...ys.options].sort((a,b)=>a.value-b.value).forEach(o=>ys.add(o));
  }
  ys.value=String(y);
  document.getElementById('select-month').value=m;
  updateDateHidden();
}

function applyDataMatrixData(raw){
  const d=parseGS1DataMatrix(raw);
  const src=document.getElementById('date-src');
  if(d.cip) document.getElementById('code').value=d.cip;
  if(d.expiry){ setDate(d.expiry.month,d.expiry.year); src.textContent='✓ scannée'; }
  else src.textContent='';
  return d;
}
['select-month','select-year'].forEach(id=>
  document.getElementById(id).addEventListener('change',()=>{document.getElementById('date-src').textContent='';}));

function initDateSelectors(){
  const yearSelect = document.getElementById('select-year');
  const monthSelect = document.getElementById('select-month');
  
  const currentYear = new Date().getFullYear();
  yearSelect.innerHTML = '';
  for(let y = currentYear; y <= currentYear + 10; y++){
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if(y === currentYear) opt.selected = true;
    yearSelect.appendChild(opt);
  }
  
  const currentMonth = String(new Date().getMonth() + 1).padStart(2, '0');
  monthSelect.value = currentMonth;
  updateDateHidden();
  
  monthSelect.addEventListener('change', updateDateHidden);
  yearSelect.addEventListener('change', updateDateHidden);
}

function updateDateHidden(){
  const m = document.getElementById('select-month').value;
  const y = document.getElementById('select-year').value;
  document.getElementById('date').value = m + '/' + y;
  validateAdd();
}

let googleInitStarted=false;
let googleWaitTries=0;
let googleInitTimeout=null;

function maybeReady(){
  const b=document.getElementById('btn-login');
  if(gapiReady && gisReady){
    b.disabled=false;
    b.textContent='Se connecter à Google';
    updateOperator();
    setStatus(operatorName ? 'Google Sheets prêt.' : 'Choisissez d’abord un opérateur sur l’accueil.');
    return;
  }

  // Give up after ~15 seconds instead of leaving the user indefinitely on "Préparation".
  if(googleWaitTries>150){
    b.disabled=false;
    b.textContent='Réessayer la connexion';
    setStatus('Google n’a pas pu être chargé. Vérifiez Internet, puis appuyez sur « Réessayer la connexion ».');
  }
}

function initGoogle(){
  // Google API client (Sheets)
  if(window.gapi && !gapiReady && !googleInitStarted){
    googleInitStarted=true;
    try{
      gapi.load('client',async()=>{
        try{
          await gapi.client.init({
            discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']
          });
          gapiReady=true;
          maybeReady();
        }catch(e){
          googleInitStarted=false;
          setStatus('Erreur Google Sheets : '+(e?.message||e));
          maybeReady();
        }
      });
    }catch(e){
      googleInitStarted=false;
      setStatus('Erreur de chargement de Google Sheets.');
      maybeReady();
    }
  }

  // Google Identity Services (OAuth)
  if(window.google?.accounts?.oauth2 && !gisReady){
    try{
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:SCOPES,
        callback:(resp)=>{
          if(!resp || resp.error || !resp.access_token){
            setStatus('Connexion Google annulée ou refusée.');
            return;
          }

          accessToken=resp.access_token;
          operatorName=localStorage.getItem('zebraOperator')||operatorName||'—';
          updateOperator();

          document.getElementById('login-panel').style.display='none';
          document.getElementById('entry-panel').style.display='flex';

          setStatus('✓ Google Sheets connecté.');
          setTimeout(()=>document.getElementById('code').focus(),100);
          validateAdd();
        }
      });

      gisReady=true;
      maybeReady();
    }catch(e){
      setStatus('Erreur Google Identity : '+(e?.message||e));
    }
  }
}

function waitForGoogle(){
  const b=document.getElementById('btn-login');
  b.disabled=true;
  b.textContent='Chargement de Google…';
  setStatus('Connexion aux services Google…');

  const timer=setInterval(()=>{
    googleWaitTries++;
    initGoogle();
    maybeReady();

    if(gapiReady && gisReady){
      clearInterval(timer);
      return;
    }

    if(googleWaitTries>150){
      clearInterval(timer);
      b.disabled=false;
      b.textContent='Réessayer la connexion';
      setStatus('Google n’a pas pu être chargé. Vérifiez Internet puis réessayez.');
    }
  },100);

  initGoogle();
}

function initiateGoogleAndOperatorLogin(){
  operatorName=localStorage.getItem('zebraOperator')||operatorName;

  if(!operatorName){
    setStatus('Aucun opérateur sélectionné. Retournez à l’accueil pour le choisir.');
    return;
  }

  if(!tokenClient || !gisReady){
    setStatus('Initialisation de Google…');
    initGoogle();

    setTimeout(()=>{
      if(tokenClient && gisReady){
        initiateGoogleAndOperatorLogin();
      }else{
        const b=document.getElementById('btn-login');
        b.disabled=false;
        b.textContent='Réessayer la connexion';
        setStatus('Google n’est pas disponible. Rechargez la page et réessayez.');
      }
    },800);
    return;
  }

  setStatus('Connexion Google en cours…');

  try{
    // "select_account" forces the Google account chooser, which is useful
    // when the browser has no active Google session or the wrong account.
    tokenClient.requestAccessToken({prompt:'select_account'});
  }catch(e){
    setStatus('Erreur de connexion Google : '+(e?.message||e));
  }
}

function initZoneAutocomplete(){
  const input=document.getElementById('zone');
  input.addEventListener('input',()=>{renderZones();validateAdd();});
  input.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    const first=document.querySelector('#zone-grid .chip');
    if(first&&!document.querySelector('#zone-grid .chip.sel'))selectZone(first.dataset.zone);
    input.blur();
  });
  renderZones();
}
function renderZones(){
  const grid=document.getElementById('zone-grid');
  const v=document.getElementById('zone').value.trim().toLowerCase();
  const exact=zones.find(z=>z.toLowerCase()===v);
  const list=(!v||exact?zones:zones.filter(z=>z.toLowerCase().includes(v)))
    .slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase(),'fr'));
  grid.innerHTML='';
  list.forEach(z=>{
    const b=document.createElement('button');
    b.type='button';b.className='chip'+(z===exact?' sel':'');
    b.textContent=z;b.dataset.zone=z;b.onclick=()=>selectZone(z);
    grid.appendChild(b);
  });
  if(!list.length)grid.innerHTML='<div class="zone-empty">Aucune zone ne correspond</div>';
}
function selectZone(z){
  document.getElementById('zone').value=z;
  renderZones();validateAdd();
  const s=document.querySelector('#zone-grid .chip.sel');
  if(s&&s.scrollIntoView)s.scrollIntoView({block:'nearest'});
}

let catalog=null;
async function loadCatalog(force){
  if(catalog&&!force)return catalog;
  const get=r=>gapi.client.sheets.spreadsheets.values.get({spreadsheetId:SPREADSHEET_ID,range:r});
  const [hist,cur]=await Promise.all([get('Feuille2').catch(()=>({result:{}})),get(RANGE)]);
  const m=new Map();
  const fill=(rows,isHist)=>{
    for(let i=1;i<rows.length;i++){
      const r=rows[i],c=formatLast6(r[3]||'');
      if(c&&r[2])m.set(c,{name:r[2],date:String(r[1]||'').trim(),hist:isHist});
    }
  };
  fill(hist.result.values||[],true);   // l'historique d'abord…
  fill(cur.result.values||[],false);   // …Feuille1 prioritaire
  return (catalog=m);
}

async function findProduct(code,dm=null){
  const prod=document.getElementById('product'),hint=document.getElementById('product-hint');
  document.getElementById('btn-add').disabled=true;
  prod.value='Recherche…';hint.className='';
  try{
    const hit=(await loadCatalog()).get(code);
    if(hit){
      prod.value=hit.name;
      if(!dm?.expiry){
        const iso=hit.date.match(/^(\d{4})-(\d{1,2})/),fr=hit.date.match(/^\d{1,2}\/(\d{1,2})\/(\d{4})/);
        const y=iso?iso[1]:fr&&fr[2],mo=iso?iso[2]:fr&&fr[1];
        if(y){setDate(String(mo).padStart(2,'0'),y);document.getElementById('date-src').textContent='↺ dernier ajout';}
      }
      document.getElementById('qty').value=1;
      document.getElementById('zone').value='';renderZones();
      hint.textContent='Produit reconnu ✓'+(hit.hist?' (historique)':'')+' — choisissez la zone';
      hint.className='ok';
      setStatus('Produit reconnu !');
      document.getElementById('code').blur();   // ferme le clavier : la liste des zones reste visible
    }else{
      prod.value='';
      hint.textContent='CIP inconnu — saisissez le nom manuellement';
      setStatus('CIP non trouvé : entrez le nom du produit.');
      prod.focus();
    }
  }catch(e){
    prod.value='';
    hint.textContent='Recherche impossible — saisie manuelle';
    setStatus('Recherche impossible : '+(e.result?.error?.message||e.message));
  }
  validateAdd();
}

const codeInput=document.getElementById('code');
let scanTimer=null;
function handleCodeInput(){
  const raw=codeInput.value.trim();
  if(!raw)return;
  if(!accessToken){setStatus('Connectez-vous à Google d’abord.');return;}
  const isDM=!!parseGS1DataMatrix(raw).gtin;
  if(!isDM&&raw.replace(/\D/g,'').length<6)return;   // saisie manuelle en cours
  const cip=formatLast6(raw);
  if(cip.length!==6)return;
  const d=applyDataMatrixData(raw);                  // CIP + date de péremption pré-enregistrés
  codeInput.value=cip;
  if(navigator.vibrate)navigator.vibrate(40);
  findProduct(cip,d);
}
codeInput.addEventListener('focus',()=>codeInput.select());   // un nouveau scan remplace l'ancien
codeInput.addEventListener('input',()=>{clearTimeout(scanTimer);scanTimer=setTimeout(handleCodeInput,150);validateAdd();});
codeInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();clearTimeout(scanTimer);handleCodeInput();}
});

function validateAdd(){
  const q=parseInt(document.getElementById('qty').value,10);
  const d=document.getElementById('date').value.trim();
  const z=zones.find(x=>x.toLowerCase()===document.getElementById('zone').value.trim().toLowerCase());
  const productName=document.getElementById('product').value.trim();
  const codeValid=/^\d{6}$/.test(document.getElementById('code').value);
  document.getElementById('btn-add').disabled=!(operatorName && accessToken && codeValid && productName && q>0 && /^\d{2}\/\d{4}$/.test(d) && z);
}


const qtyMinus=document.getElementById('qty-minus');
const qtyPlus=document.getElementById('qty-plus');
const qtyInput=document.getElementById('qty');
if(qtyMinus) qtyMinus.onclick=()=>{qtyInput.value=Math.max(1,(parseInt(qtyInput.value)||1)-1);validateAdd();};
if(qtyPlus) qtyPlus.onclick=()=>{qtyInput.value=(parseInt(qtyInput.value)||1)+1;validateAdd();};
document.getElementById('product').oninput=validateAdd;
if(qtyInput) qtyInput.oninput=validateAdd;

async function openTable(){
  const modal=document.getElementById('table-modal');
  const content=document.getElementById('table-content');
  modal.style.display='flex';
  content.innerHTML='<div class="empty-table">Chargement de Feuille1…</div>';
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({
      spreadsheetId:SPREADSHEET_ID,range:RANGE
    });
    const rows=res.result.values||[];
    if(rows.length<=1){
      content.innerHTML='<div class="empty-table">Feuille1 est vide.</div>';
      return;
    }
    const data=rows.slice(Math.max(1,rows.length-30));
    const escHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const head=['Opérateur','Date','Produit','CIP','Qté','Zone','Vendu','Vendu avant','Ajouté le'];
    content.innerHTML='<table id="sheet-table"><thead><tr>'+
      head.map(h=>'<th>'+h+'</th>').join('')+
      '</tr></thead><tbody>'+
      data.slice().reverse().map(r=>'<tr>'+Array.from({length:9},(_,i)=>'<td>'+escHtml(r[i]||'')+'</td>').join('')+'</tr>').join('')+
      '</tbody></table>';
  }catch(e){
    content.innerHTML='<div class="empty-table">Erreur : '+String(e.result?.error?.message||e.message||e)+'</div>';
  }
}
function closeTable(){document.getElementById('table-modal').style.display='none';}

async function addRowToSheet(){
  const btn=document.getElementById('btn-add');
  if(btn.disabled) return;
  const code=formatLast6(document.getElementById('code').value);
  const productVal=document.getElementById('product').value.trim();
  const date=document.getElementById('date').value.trim();
  const qty=parseInt(document.getElementById('qty').value,10);
  const zone=zones.find(x=>x.toLowerCase()===document.getElementById('zone').value.trim().toLowerCase());
  
  if(!/^\d{6}$/.test(code)||!productVal||!zone||qty<1||!/^\d{2}\/\d{4}$/.test(date)){
    setStatus('Vérifiez les champs du formulaire.');
    return;
  }
  
  const [m,y]=date.split('/');
  const lastDay=new Date(Number(y),Number(m),0).getDate();
  const dateVal=`${y}-${m}-${lastDay}`;
  const now=new Date().toLocaleString('fr-FR');
  const values=[[operatorName,dateVal,productVal,code,qty,zone,'',0,now]];
  
  btn.disabled=true; btn.textContent='ENREGISTREMENT…';
  try{
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId:SPREADSHEET_ID,
      range:RANGE,
      valueInputOption:'USER_ENTERED',
      resource:{values}
    });
    setStatus('✓ Produit ajouté avec succès ! — Ouvrez « VOIR TABLEAU » pour vérifier.');
    
    if(catalog)catalog.set(code,{name:productVal,date:dateVal,hist:false});
    document.getElementById('code').value='';
    document.getElementById('product').value='';
    const hint=document.getElementById('product-hint');
    hint.textContent='Scannez le Data Matrix du produit suivant';hint.className='';
    document.getElementById('zone').value='';renderZones();
    document.getElementById('qty').value=1;
    document.getElementById('date-src').textContent='';
    btn.textContent='AJOUTER LE PRODUIT';
    validateAdd();
    setTimeout(()=>document.getElementById('code').focus(),50);
  }catch(e){
    btn.disabled=false; btn.textContent='AJOUTER LE PRODUIT';
    setStatus('Erreur d’enregistrement : '+(e.result?.error?.message||e.message));
  }
}

window.addEventListener('error',e=>{
  if(!gapiReady || !gisReady){
    const b=document.getElementById('btn-login');
    b.disabled=false;
    b.textContent='Réessayer la connexion';
    setStatus('Erreur de chargement : '+(e.message||'Google n’est pas disponible.'));
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeTable();}});

window.addEventListener('load',()=>{
  updateOperator();
  initDateSelectors();
  initZoneAutocomplete();
  waitForGoogle();
});
</script>
