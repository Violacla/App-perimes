<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bcd7ed">
<title>Ajouter un produit Zebra - Pharmacie du Libron</title>
<script async defer src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{--bg:#eaf4fa;--card:rgba(255,255,255,.94);--text:#26384d;--muted:#718096;--blue:#5b8fc9;--blue-dark:#3972ad;--pink:#d99aae;--pink-dark:#c77991;--soft-blue:#e5eff9;--soft-pink:#f7e5eb;--green:#bfdbc4;--green2:#86bf8e;--border:#cbddea;--shadow:0 7px 20px rgba(62,91,122,.12)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#dceef8 0%,#bcd7ed 48%,#f5fafd 100%);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:7px;min-height:100dvh}
header{background:rgba(255,255,255,.78);border:1px solid rgba(203,221,234,.9);border-radius:16px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:36px;height:36px;border-radius:50%;object-fit:cover}
h1{font-size:17px;margin:0;color:var(--blue-dark)}
.operator-badge{font-size:11px;font-weight:bold;color:var(--dark)}
.login,.panel{background:var(--soft);border-radius:10px;padding:9px;margin-top:8px}
label{display:block;font-size:11px;font-weight:bold;margin:7px 0 4px;color:var(--dark)}
input{width:100%;height:42px;border:1px solid var(--border);border-radius:9px;padding:0 9px;font-size:15px;background:white;color:var(--text)} input:focus{outline:2px solid rgba(217,154,174,.45)}
.google,.save{width:100%;height:44px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.google{margin-top:7px;background:var(--blue-dark);color:#fff}
.save{margin-top:8px;background:var(--pink);color:#fff;font-size:16px}
.save:disabled{opacity:.45}
.scan-box{background:linear-gradient(135deg,var(--soft-blue),var(--soft-pink));border:1px solid var(--border);border-radius:16px;padding:10px}
.scan-title{font-size:11px;font-weight:bold;color:var(--dark);margin-bottom:4px;text-align:center}
#code{height:50px;border:2px solid var(--blue-dark);font-size:22px;font-weight:bold;text-align:center;letter-spacing:1px}
.product-card{background:white;border:1px solid var(--border);border-radius:10px;padding:8px;margin-top:7px}
.product-name{font-size:18px;font-weight:bold;color:var(--dark);min-height:22px}
.product-zone{font-size:12px;font-weight:bold;margin-top:3px}
.product-zone span{color:var(--pink-dark)}
.row{display:flex;gap:7px;margin-top:7px}
.field{flex:1;background:var(--soft);border-radius:9px;padding:7px}
.field-label{font-size:10px;font-weight:bold;color:var(--dark);margin-bottom:3px}
.qty-control{display:flex;align-items:center;gap:4px}
.qty-btn{width:38px;height:38px;border:0;border-radius:7px;background:var(--soft-blue);color:var(--blue-dark);font-size:22px;font-weight:bold}
#qty{text-align:center;height:38px;font-weight:bold}
.zone-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;z-index:20;background:white;border:1px solid #ccc;border-radius:7px;list-style:none;margin:3px 0 0;padding:0;max-height:140px;overflow-y:auto}
.autocomplete-list li{padding:8px 9px;color:#000;font-size:13px}
.autocomplete-list li:hover,.autocomplete-list li.active{background:var(--green2);color:white}
.status{min-height:17px;text-align:center;font-size:11px;font-weight:bold;color:var(--dark);margin:5px 0}
.back-link{display:block;text-align:center;margin-top:5px;color:#16416d;text-decoration:none;font-size:11px;font-weight:bold}
@media(max-height:650px){
 .app{padding:4px}.logo{width:31px;height:31px}h1{font-size:15px}
 #code{height:44px}.product-card{padding:6px}.row{margin-top:5px}
 .save{height:44px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <a href="index.html">
      <img class="logo" src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron">
    </a>
    <h1>Mode Zebra</h1>
  </div>
  <div id="operator-badge" class="operator-badge"></div>
</header>

<div class="login" id="login-panel">
  <div style="font-size:13px;font-weight:bold;color:#0a2f51;text-align:center;">Connexion à Google Sheets</div>
  <button class="google" id="btn-login" onclick="initiateGoogleAndOperatorLogin()">Se connecter à Google</button>
</div>

<div class="panel" id="entry-panel" style="display:none;">
  <div class="scan-box">
    <div class="scan-title">SCAN PRODUIT</div>
    <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Scannez le CIP">
  </div>

  <div class="product-card">
    <div id="product" class="product-name">En attente du scan…</div>
    <div class="product-zone">Zone : <span id="zone-display">—</span></div>
  </div>

  <div class="row">
    <div class="field">
      <div class="field-label">DATE</div>
      <input id="date" type="text" inputmode="numeric" autocomplete="off" placeholder="MM/YYYY">
    </div>
    <div class="field">
      <div class="field-label">QUANTITÉ</div>
      <div class="qty-control">
        <button type="button" class="qty-btn" id="qty-minus">−</button>
        <input id="qty" type="number" min="1" value="1">
        <button type="button" class="qty-btn" id="qty-plus">+</button>
      </div>
    </div>
  </div>

  <div class="field" style="margin-top:7px;">
    <div class="field-label">ZONE PRÉ-ENREGISTRÉE</div>
    <div class="zone-wrap">
      <input id="zone" type="text" autocomplete="off" placeholder="Zone automatique">
      <ul class="autocomplete-list" id="zone-suggestions" style="display:none;"></ul>
    </div>
  </div>

  <button class="save" id="btn-add" onclick="addRowToSheet()" disabled>AJOUTER</button>
</div>

<pre id="status" class="status"></pre>
<a href="index.html" class="back-link">← Accueil</a>
</div>
<script>
// --- CONFIGURATION API GOOGLE SHEETS ---
const CLIENT_ID = '777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID = '1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE = 'Feuille1'; 
const SCOPES = "https://www.googleapis.com/auth/spreadsheets";

// Liste identique des zones préenregistrées
const zones = [
  "aboca", "aderma", "arko", "aromat", "avene", "bain", "bande", "bébé",
  "bien etre", "bioderma", "bi-oil", "bonbon", "brumes et senteurs", "cerave",
  "circulation", "clearskin", "collagene", "coloration", "confort", "conseil",
  "cooper geo", "cosmeto", "dentaire", "deo", "dermato", "dexeryl", "dietetique",
  "douleurs", "durex", "enfants", "forme", "frigo", "homeo", "hydratis", "intime",
  "la roche posay","LRP", "la rosee", "levres et mains", "moustik",
  "noreva", "nutergia", "nuxe", "ongles", "oreille", "pieds et mains", "pileje",
  "poux", "ronflement", "cheveux", "corps", "STUP", "svr", "tisanes", "uriage",
  "nature", "vichy", "yeux", "1ersoins", "4patte"
];

let tokenClient, gapiInited = false, gisInited = false, accessToken = null, operatorName = null;
let pendingOperatorName = null;

window.onload = function() {
  gapi.load('client', gapiLoaded);
  gisLoaded();
  initZoneAutocomplete();
};

async function gapiLoaded() {
  await gapi.client.init({
    discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"]
  });
  gapiInited = true;
  maybeEnable();
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (tokenResponse) => {
      accessToken = tokenResponse.access_token;
      if (pendingOperatorName) {
        operatorName = pendingOperatorName;
        document.getElementById('login-panel').style.display = 'none';
        document.getElementById('entry-panel').style.display = 'block';
        setStatus(`Connecté en tant que ${operatorName}.`);
        document.getElementById('code').focus();
      } else {
        setStatus('Erreur : Nom d\'opérateur non trouvé.');
      }
      pendingOperatorName = null;
    },
  });
  gisInited = true;
  maybeEnable();
}

function maybeEnable() {
  if (gapiInited && gisInited) {
    document.getElementById('operator').focus();
    setStatus('Veuillez entrer votre nom d\'opérateur.');
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

async function initiateGoogleAndOperatorLogin() {
  const op = document.getElementById('operator').value.trim();
  if (!op) {
    alert("Veuillez entrer un nom d'opérateur.");
    return;
  }
  pendingOperatorName = op;
  try {
    await tokenClient.requestAccessToken();
    setStatus('Connexion Google en cours...');
  } catch (error) {
    console.error("Erreur connexion:", error);
    setStatus("Erreur de connexion Google.");
    pendingOperatorName = null;
  }
}

// Interface Zebra compacte
function updateOperatorBadge(){
  const el=document.getElementById('operator-badge');
  if(el && operatorName) el.textContent='👤 '+operatorName;
}
\n// --- GESTION AUTOCOMPLÉTION DES ZONES ---
function initZoneAutocomplete() {
  const input = document.getElementById('zone');
  const list = document.getElementById('zone-suggestions');
  let currentFocus = -1;

  input.addEventListener('input', function () {
    const val = this.value.toLowerCase();
    list.innerHTML = '';
    currentFocus = -1;
    if (val.length < 1) {
      list.style.display = 'none';
      return;
    }

    const matches = zones.filter(z => z.toLowerCase().includes(val));
    if (matches.length === 0) {
      list.style.display = 'none';
      return;
    }

    matches.forEach((zone) => {
      const li = document.createElement('li');
      li.textContent = zone;
      li.addEventListener('click', () => {
        input.value = zone;
        list.innerHTML = '';
        list.style.display = 'none';
      });
      list.appendChild(li);
    });

    const rect = input.getBoundingClientRect();
    const panelRect = input.closest('.panel').getBoundingClientRect();
    list.style.top = (rect.bottom - panelRect.top) + 'px';
    list.style.left = (rect.left - panelRect.left) + 'px';
    list.style.width = input.offsetWidth + 'px';
    list.style.display = 'block';
  });

  input.addEventListener('keydown', function (e) {
    const items = list.querySelectorAll("li");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
      currentFocus++;
      if (currentFocus >= items.length) currentFocus = 0;
      updateActive(items);
      e.preventDefault();
    } else if (e.key === "ArrowUp") {
      currentFocus--;
      if (currentFocus < 0) currentFocus = items.length - 1;
      updateActive(items);
      e.preventDefault();
    } else if (e.key === "Enter") {
      if (currentFocus > -1 && items[currentFocus]) {
        e.preventDefault();
        items[currentFocus].click();
      }
    }
  });

  function updateActive(items) {
    items.forEach(i => i.classList.remove("active"));
    if (items[currentFocus]) {
      items[currentFocus].classList.add("active");
      items[currentFocus].scrollIntoView({ block: "nearest" });
    }
  }

  document.addEventListener('click', function (e) {
    if (!input.contains(e.target) && !list.contains(e.target)) {
      list.style.display = 'none';
    }
  });
}

// --- RECHERCHE AUTOMATIQUE DU PRODUIT PAR CODE ---
document.getElementById('code').addEventListener('input', async function() {
  const codeVal = this.value.replace(/\D/g, '').slice(-6);

  try {
    const sheets = ['Feuille1', 'Feuille2'];
    for (let sheet of sheets) {
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: SPREADSHEET_ID,
        range: sheet
      });

      const rows = res.result.values || [];
      for (let i = 1; i < rows.length; i++) {
        const sheetCodeFormatted = String(rows[i][3] || '').padStart(6, '0');
        if (sheetCodeFormatted === codeVal) {
          document.getElementById('product').value = rows[i][2] || '';
          document.getElementById('zone').value = rows[i][5] || '';
          return;
        }
      }
    }
  } catch (e) {
    console.error("Erreur recherche produit :", e);
  }
});

// --- AJOUT DE LA LIGNE DANS LE GOOGLE SHEET ---
async function addRowToSheet() {
  const code = document.getElementById('code').value.trim();
  const product = document.getElementById('product').value.trim();
  const date = document.getElementById('date').value.trim();
  const qty = document.getElementById('qty').value.trim();
  const zone = document.getElementById('zone').value.trim();

  if (!code || !product || !date || !qty || !zone) {
    alert("Veuillez remplir tous les champs.");
    return;
  }

  if (!zones.includes(zone.toLowerCase())) {
    alert("Veuillez choisir une zone valide existante dans la liste.");
    return;
  }

  const now = new Date();
  const ajoutVal = now.toLocaleString('fr-FR');

  const newRow = [
    operatorName, 
    date, 
    product, 
    code, 
    Number(qty), 
    zone, 
    "",  
    0,   
    ajoutVal   
  ];

  try {
    setStatus("Ajout en cours...");
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId: SPREADSHEET_ID,
      range: RANGE + '!A:I',
      valueInputOption: 'USER_ENTERED',
      resource: { values: [newRow] }
    });

    setStatus("✓ Ligne ajoutée avec succès !");
    
    document.getElementById('code').value = '';
    document.getElementById('product').value = '';
    document.getElementById('date').value = '';
    document.getElementById('qty').value = '';
    document.getElementById('zone').value = '';
    document.getElementById('code').focus();

  } catch (e) {
    setStatus("Erreur lors de l'ajout : " + e.message);
  }
}
</script>
</body>
</html>
