<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bcd7ed">
<title>Ajouter un produit Zebra - Pharmacie du Libron</title>
<script async defer src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#26384d;--muted:#718096;--blue:#bcd7ed;--blue-dark:#3972ad;--green:#16834f;--green-light:#edf9f3;--border:#d5e0ec;--shadow:0 5px 18px rgba(62,91,122,.12)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100dvh;padding:12px}
header{background:var(--blue);border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:18px;color:#163f5b}
.google, .save {width:100%;min-height:44px;border:0;border-radius:13px;font-weight:800;cursor:pointer;margin-bottom:9px}
.google{background:#0a2f51;color:#bcd7ed}
.google:disabled{opacity:.45;cursor:not-allowed}
.panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:15px;box-shadow:var(--shadow);position:relative}
label{display:block;font-size:11px;font-weight:800;margin:11px 0 5px;color:#0a2f51}
input, select{width:100%;height:44px;border:1px solid var(--border);border-radius:11px;padding:0 11px;font-size:14px;background:#e1f4e4;color:var(--text)}
input:focus, select:focus{outline:2px solid #86bf8e}
.save{background:#bfdbc4;color:black;margin-top:15px;margin-bottom:0}
.save:hover{background:#86bf8e;color:white}
.status{font-size:12px;font-weight:bold;color:#0a2f51;text-align:center;min-height:17px;margin:7px 0}
.back-link{display:block;text-align:center;margin-top:15px;color:#16416d;text-decoration:none;font-weight:bold;font-size:12px}
.back-link:hover{text-decoration:underline}

/* Style des suggestions de zones (identique à Index) */
.autocomplete-list {
  position: absolute;
  background-color: white;
  border: 1px solid #ccc;
  border-radius: 4px;
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 150px;
  overflow-y: auto;
  width: calc(100% - 30px);
  z-index: 999;
}
.autocomplete-list li {
  padding: 8px 10px;
  cursor: pointer;
  color: black;
}
.autocomplete-list li:hover,
.autocomplete-list li.active {
  background-color: #86bf8e;
  color: white;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Mode Zebra - Ajout</h1>
    </div>
  </header>

  <div class="panel" id="login-panel" style="margin-bottom:10px;">
    <label for="operator">Nom de l'opérateur</label>
    <input type="text" id="operator" placeholder="Entrez votre nom..." autocomplete="off">
    <button class="google" id="btn-login" onclick="initiateGoogleAndOperatorLogin()" style="margin-top:10px;">Se connecter à Google Sheets</button>
  </div>

  <div class="panel" id="entry-panel" style="display:none;">
    <label for="code">Code (6 chiffres)</label>
    <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Scannez ou tapez le code...">

    <label for="product">Nom Produit</label>
    <input type="text" id="product" placeholder="Nom du produit" autocomplete="off">

    <label for="date">Date (MM/YYYY)</label>
    <input type="text" id="date" placeholder="MM/YYYY" autocomplete="off">

    <label for="qty">Nb boîtes</label>
    <input type="number" id="qty" min="0" placeholder="Quantité" autocomplete="off">

    <label for="zone">Zone</label>
    <input type="text" id="zone" placeholder="Zone" autocomplete="off">
    <ul class="autocomplete-list" id="zone-suggestions" style="display: none;"></ul>

    <button class="save" id="btn-add" onclick="addRowToSheet()">Ajouter la ligne</button>
  </div>

  <pre id="status" class="status"></pre>
  <a href="index.html" class="back-link">← Retour à l'accueil</a>
</div>

<script>
// --- CONFIGURATION API GOOGLE SHEETS ---
const CLIENT_ID = '777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID = '1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE = 'Feuille1'; 
const SCOPES = "https://www.googleapis.com/auth/spreadsheets";

// Liste identique des zones préenregistrées
const zones = [
  "aboca", "aderma", "arko", "aromat", "avene", "bain", "bande", "bébé",
  "bien etre", "bioderma", "bi-oil", "bonbon", "brumes et senteurs", "cerave",
  "circulation", "clearskin", "collagene", "coloration", "confort", "conseil",
  "cooper geo", "cosmeto", "dentaire", "deo", "dermato", "dexeryl", "dietetique",
  "douleurs", "durex", "enfants", "forme", "frigo", "homeo", "hydratis", "intime",
  "la roche posay","LRP", "la rosee", "levres et mains", "moustik",
  "noreva", "nutergia", "nuxe", "ongles", "oreille", "pieds et mains", "pileje",
  "poux", "ronflement", "cheveux", "corps", "STUP", "svr", "tisanes", "uriage",
  "nature", "vichy", "yeux", "1ersoins", "4patte"
];

let tokenClient, gapiInited = false, gisInited = false, accessToken = null, operatorName = null;
let pendingOperatorName = null;

window.onload = function() {
  gapi.load('client', gapiLoaded);
  gisLoaded();
  initZoneAutocomplete();
};

async function gapiLoaded() {
  await gapi.client.init({
    discoveryDocs: ["https://sheets.googleapis.com/$discovery/rest?version=v4"]
  });
  gapiInited = true;
  maybeEnable();
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: (tokenResponse) => {
      accessToken = tokenResponse.access_token;
      if (pendingOperatorName) {
        operatorName = pendingOperatorName;
        document.getElementById('login-panel').style.display = 'none';
        document.getElementById('entry-panel').style.display = 'block';
        setStatus(`Connecté en tant que ${operatorName}.`);
        document.getElementById('code').focus();
      } else {
        setStatus('Erreur : Nom d\'opérateur non trouvé.');
      }
      pendingOperatorName = null;
    },
  });
  gisInited = true;
  maybeEnable();
}

function maybeEnable() {
  if (gapiInited && gisInited) {
    document.getElementById('operator').focus();
    setStatus('Veuillez entrer votre nom d\'opérateur.');
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

async function initiateGoogleAndOperatorLogin() {
  const op = document.getElementById('operator').value.trim();
  if (!op) {
    alert("Veuillez entrer un nom d'opérateur.");
    return;
  }
  pendingOperatorName = op;
  try {
    await tokenClient.requestAccessToken();
    setStatus('Connexion Google en cours...');
  } catch (error) {
    console.error("Erreur connexion:", error);
    setStatus("Erreur de connexion Google.");
    pendingOperatorName = null;
  }
}

// --- GESTION AUTOCOMPLÉTION DES ZONES ---
function initZoneAutocomplete() {
  const input = document.getElementById('zone');
  const list = document.getElementById('zone-suggestions');
  let currentFocus = -1;

  input.addEventListener('input', function () {
    const val = this.value.toLowerCase();
    list.innerHTML = '';
    currentFocus = -1;
    if (val.length < 1) {
      list.style.display = 'none';
      return;
    }

    const matches = zones.filter(z => z.toLowerCase().includes(val));
    if (matches.length === 0) {
      list.style.display = 'none';
      return;
    }

    matches.forEach((zone) => {
      const li = document.createElement('li');
      li.textContent = zone;
      li.addEventListener('click', () => {
        input.value = zone;
        list.innerHTML = '';
        list.style.display = 'none';
      });
      list.appendChild(li);
    });

    const rect = input.getBoundingClientRect();
    const panelRect = input.closest('.panel').getBoundingClientRect();
    list.style.top = (rect.bottom - panelRect.top) + 'px';
    list.style.left = (rect.left - panelRect.left) + 'px';
    list.style.width = input.offsetWidth + 'px';
    list.style.display = 'block';
  });

  input.addEventListener('keydown', function (e) {
    const items = list.querySelectorAll("li");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
      currentFocus++;
      if (currentFocus >= items.length) currentFocus = 0;
      updateActive(items);
      e.preventDefault();
    } else if (e.key === "ArrowUp") {
      currentFocus--;
      if (currentFocus < 0) currentFocus = items.length - 1;
      updateActive(items);
      e.preventDefault();
    } else if (e.key === "Enter") {
      if (currentFocus > -1 && items[currentFocus]) {
        e.preventDefault();
        items[currentFocus].click();
      }
    }
  });

  function updateActive(items) {
    items.forEach(i => i.classList.remove("active"));
    if (items[currentFocus]) {
      items[currentFocus].classList.add("active");
      items[currentFocus].scrollIntoView({ block: "nearest" });
    }
  }

  document.addEventListener('click', function (e) {
    if (!input.contains(e.target) && !list.contains(e.target)) {
      list.style.display = 'none';
    }
  });
}

// --- RECHERCHE AUTOMATIQUE DU PRODUIT PAR CODE ---
document.getElementById('code').addEventListener('input', async function() {
  const codeVal = this.value.trim();
  if (!/^\d{6}$/.test(codeVal)) return;

  try {
    const sheets = ['Feuille1', 'Feuille2'];
    for (let sheet of sheets) {
      const res = await gapi.client.sheets.spreadsheets.values.get({
        spreadsheetId: SPREADSHEET_ID,
        range: sheet
      });

      const rows = res.result.values || [];
      for (let i = 1; i < rows.length; i++) {
        const sheetCodeFormatted = String(rows[i][3] || '').padStart(6, '0');
        if (sheetCodeFormatted === codeVal) {
          document.getElementById('product').value = rows[i][2] || '';
          document.getElementById('zone').value = rows[i][5] || '';
          return;
        }
      }
    }
  } catch (e) {
    console.error("Erreur recherche produit :", e);
  }
});

// --- AJOUT DE LA LIGNE DANS LE GOOGLE SHEET ---
async function addRowToSheet() {
  const code = document.getElementById('code').value.trim();
  const product = document.getElementById('product').value.trim();
  const date = document.getElementById('date').value.trim();
  const qty = document.getElementById('qty').value.trim();
  const zone = document.getElementById('zone').value.trim();

  if (!code || !product || !date || !qty || !zone) {
    alert("Veuillez remplir tous les champs.");
    return;
  }

  if (!zones.includes(zone.toLowerCase())) {
    alert("Veuillez choisir une zone valide existante dans la liste.");
    return;
  }

  const now = new Date();
  const ajoutVal = now.toLocaleString('fr-FR');

  const newRow = [
    operatorName, 
    date, 
    product, 
    code, 
    Number(qty), 
    zone, 
    "",  
    0,   
    ajoutVal   
  ];

  try {
    setStatus("Ajout en cours...");
    await gapi.client.sheets.spreadsheets.values.append({
      spreadsheetId: SPREADSHEET_ID,
      range: RANGE + '!A:I',
      valueInputOption: 'USER_ENTERED',
      resource: { values: [newRow] }
    });

    setStatus("✓ Ligne ajoutée avec succès !");
    
    document.getElementById('code').value = '';
    document.getElementById('product').value = '';
    document.getElementById('date').value = '';
    document.getElementById('qty').value = '';
    document.getElementById('zone').value = '';
    document.getElementById('code').focus();

  } catch (e) {
    setStatus("Erreur lors de l'ajout : " + e.message);
  }
}
</script>
</body>
</html>
