<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>Mois actuel</title>
<style>
:root{
 --bg:#f4f7fb;--card:#fff;--text:#26384d;--muted:#718096;
 --blue:#5b8fc9;--blue2:#3972ad;--pink:#d99aae;--green:#86bf8e;
 --orange:#e8b56b;--soft-blue:#e5eff9;--soft-pink:#f7e5eb;
 --soft-green:#eef8ef;--soft-orange:#fff6e7;--border:#d5e0ec;
 --shadow:0 4px 14px rgba(62,91,122,.12)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:500px;min-height:100dvh;padding:12px 10px 22px}
header{text-align:center;padding:4px 2px 10px}
.logo{width:50px;height:50px;margin:0 auto 7px;border-radius:15px;background:linear-gradient(135deg,var(--soft-blue),var(--soft-pink));display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0;color:#163f5b}
.subtitle{font-size:11px;color:var(--muted);margin:4px 0}
.session{font-size:11px;color:var(--muted);text-align:center;margin-bottom:9px}
.session strong{color:var(--text)}
.topbar{display:flex;gap:7px;margin-bottom:10px}
.topbar button,.back{flex:1;min-height:40px;border:1px solid var(--border);background:#fff;border-radius:11px;font-weight:700;color:var(--text)}
.login{background:#f8fbff;border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:9px;text-align:center}
.login button{margin-top:7px;border:0;background:var(--blue2);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;min-height:40px}
.status{font-size:11px;color:var(--muted);text-align:center;min-height:17px;margin:5px 0 9px}
.months{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:10px}
.month-card{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:16px;background:#fff;padding:14px;box-shadow:var(--shadow);cursor:pointer;min-height:92px}
.month-card:active{transform:scale(.99)}
.month-card .small{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.3px}
.month-card strong{display:block;font-size:18px;margin:3px 0}
.month-card .rule{font-size:12px;font-weight:700}
.month-card .nb{font-size:11px;color:var(--muted);margin-top:5px}
.c1{border-left:7px solid var(--pink);background:var(--soft-pink)}
.c2{border-left:7px solid var(--orange);background:var(--soft-orange)}
.c3{border-left:7px solid var(--green);background:var(--soft-green)}
.c4{border-left:7px solid var(--blue);background:var(--soft-blue)}
.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin-bottom:10px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2{font-size:15px;margin:0}
.count{font-size:11px;color:var(--muted)}
.product{background:#fff;border:1px solid var(--border);border-radius:15px;padding:11px;margin-bottom:8px;box-shadow:0 2px 8px rgba(62,91,122,.05)}
.product.sold-out{opacity:.58}
.product-title{font-weight:800;font-size:14px;line-height:1.25}
.code{font-size:12px;color:var(--blue2);font-weight:700;margin-top:3px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;margin-top:9px}
.facts div{background:#f7f9fc;border-radius:8px;padding:6px}
.facts span{display:block;font-size:9px;color:var(--muted)}
.facts strong{font-size:11px}
.actions{display:flex;gap:7px;margin-top:9px}
.btn{flex:1;min-height:39px;border:0;border-radius:10px;font-weight:700;font-size:11px;cursor:pointer}
.btn-sold{background:#d8c0ca;color:#26384d}
.btn-promo{background:var(--green);color:#fff}
.btn-highlight{background:var(--blue);color:#fff}
.empty{padding:25px 8px;text-align:center;color:var(--muted);font-size:12px}
.detail-row{padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.detail-row:last-child{border-bottom:0}
.detail-row strong{display:block;font-size:13px;margin-bottom:2px}
@media(min-width:480px){.months{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="logo">🏷️</div>
  <h1>Mois actuel</h1>
  <p class="subtitle">Produits à promouvoir fortement</p>
</header>
<div class="session">Opérateur : <strong id="operator">—</strong></div>

<div class="topbar">
  <button class="back" onclick="location.href='TrimestreZebra.html'">⬅ Trimestre</button>
</div>
<div class="panel">
  <div class="panel-head">
    <h2 id="monthTitle">Mois actuel</h2>
    <span class="count" id="count">0 produit</span>
  </div>
  <div id="googleLogin" class="login">
    <div id="status">Connexion à Google Sheets nécessaire pour afficher les produits.</div>
    <button id="googleLoginBtn" onclick="connectGoogle()" disabled>Se connecter à Google</button>
  </div>
</div>
<section id="products"></section>

</main>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script>

const CLIENT_ID='777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID='1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const RANGE='Feuille1';
const SCOPES='https://www.googleapis.com/auth/spreadsheets';

let tokenClient=null, gapiInited=false, gisInited=false, accessToken=null, sheetRows=[];

const operatorName=localStorage.getItem('zebraOperator') || '—';
document.addEventListener('DOMContentLoaded',()=>{
  const op=document.getElementById('operator');
  if(op) op.textContent=operatorName;
});

function gapiLoaded(){ gapi.load('client', initializeGapiClient); }
async function initializeGapiClient(){
  try{
    await gapi.client.init({
      discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']
    });
    gapiInited=true;
    maybeReady();
  }catch(e){ setStatus('Erreur Google API : '+e.message); }
}
function gisLoaded(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPES,
    callback:async (tokenResponse)=>{
      if(tokenResponse.error){
        setStatus('Connexion Google refusée.');
        return;
      }
      accessToken=tokenResponse.access_token;
      setStatus('Google Sheets connecté. Chargement…');
      const login=document.getElementById('googleLogin');
      if(login) login.style.display='none';
      await loadSheet();
    }
  });
  gisInited=true;
  maybeReady();
}
function maybeReady(){
  if(gapiInited && gisInited){
    const btn=document.getElementById('googleLoginBtn');
    if(btn) btn.disabled=false;
  }
}
function connectGoogle(){
  if(!tokenClient || !gapiInited){
    setStatus('Google est encore en cours de chargement…');
    return;
  }
  tokenClient.requestAccessToken({prompt:''});
}
function setStatus(msg){
  const el=document.getElementById('status');
  if(el) el.textContent=msg;
}
function monthStart(){
  const d=new Date();
  let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()>=15){
    m++;
    if(m===12){m=0;y++;}
  }
  return {y,m};
}
function addMonths(y,m,n){
  const d=new Date(y,m+n,1);
  return {y:d.getFullYear(),m:d.getMonth()};
}
function monthKey(y,m){return `${y}-${String(m+1).padStart(2,'0')}`;}
function monthLabel(y,m){
  return new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
}
function classifyDate(value){
  if(!value) return null;
  const s=String(value).trim();
  let y,m;
  let match=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if(match){y=+match[1];m=+match[2]-1;}
  else{
    const d=new Date(s);
    if(isNaN(d)) return null;
    y=d.getFullYear();m=d.getMonth();
  }
  const start=monthStart();
  return (y-start.y)*12+(m-start.m);
}
function formatCode(v){
  const s=String(v??'').replace(/\D/g,'');
  return s ? s.padStart(6,'0') : '';
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
async function loadSheet(){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({
      spreadsheetId:SPREADSHEET_ID, range:RANGE
    });
    sheetRows=res.result.values||[];
    renderPage();
  }catch(e){
    setStatus('Erreur de chargement Google Sheets : '+e.message);
  }
}
async function updateCell(row,col,value){
  await gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId:SPREADSHEET_ID,
    range:`Feuille1!${col}${row}`,
    valueInputOption:'USER_ENTERED',
    resource:{values:[[value]]}
  });
}
async function getSheetIds(){
  const meta=await gapi.client.sheets.spreadsheets.get({
    spreadsheetId:SPREADSHEET_ID,
    fields:'sheets.properties(sheetId,title)'
  });
  return meta.result.sheets||[];
}
async function transferToFeuille2(sheetRowNumber){
  const sheets=await getSheetIds();
  const f1=sheets.find(s=>s.properties.title==='Feuille1');
  const f2=sheets.find(s=>s.properties.title==='Feuille2');
  if(!f1 || !f2) throw new Error('Feuille1 ou Feuille2 introuvable.');

  const res=await gapi.client.sheets.spreadsheets.values.get({
    spreadsheetId:SPREADSHEET_ID,
    range:`Feuille1!A${sheetRowNumber}:Z${sheetRowNumber}`
  });
  const row=(res.result.values||[])[0];
  if(!row) throw new Error('Ligne introuvable.');

  const append=await gapi.client.sheets.spreadsheets.values.append({
    spreadsheetId:SPREADSHEET_ID,
    range:'Feuille2!A1',
    valueInputOption:'USER_ENTERED',
    insertDataOption:'INSERT_ROWS',
    includeValuesInResponse:true,
    resource:{values:[row]}
  });
  if(!append.result?.updates?.updatedRows) throw new Error('Transfert non confirmé.');

  await gapi.client.sheets.spreadsheets.batchUpdate({
    spreadsheetId:SPREADSHEET_ID,
    resource:{requests:[{deleteDimension:{
      range:{
        sheetId:f1.properties.sheetId,
        dimension:'ROWS',
        startIndex:sheetRowNumber-1,
        endIndex:sheetRowNumber
      }
    }}]}
  });
}
async function markSold(sheetRowNumber,button){
  button.disabled=true;
  try{
    await transferToFeuille2(sheetRowNumber);
    setStatus('✓ Produit transféré dans Feuille2.');
    await loadSheet();
  }catch(e){
    button.disabled=false;
    setStatus('Erreur : '+e.message);
  }
}
async function setPromo(sheetRowNumber,type,button){
  const defaults=['50','20','0'];
  const v=prompt('Pourcentage de promotion (0 à 100) :',defaults[type]||'0');
  if(v===null)return;
  const n=Number(v);
  if(!Number.isInteger(n)||n<0||n>100){
    alert('Entrez un nombre entier entre 0 et 100.');
    return;
  }
  button.disabled=true;
  try{
    await updateCell(sheetRowNumber,'H',n);
    setStatus('✓ Promotion enregistrée dans Google Sheets.');
    await loadSheet();
  }catch(e){
    button.disabled=false;
    setStatus('Erreur : '+e.message);
  }
}
function productRowsFor(type){
  const result=[];
  for(let i=1;i<sheetRows.length;i++){
    const r=sheetRows[i];
    const c=classifyDate(r[1]);
    let ok=false;
    if(type==='all') ok=c!==null && c>=0 && c<=2;
    else ok=c===type;
    if(ok) result.push({r,row:i+1});
  }
  return result;
}
function renderProducts(type){
  const box=document.getElementById('products');
  const rows=productRowsFor(type);
  const count=document.getElementById('count');
  if(count) count.textContent=rows.length+' produit'+(rows.length>1?'s':'');
  if(!rows.length){
    box.innerHTML='<div class="empty">Aucun produit pour cette période.</div>';
    return;
  }
  box.innerHTML=rows.map(({r,row})=>{
    const sold=Number(r[6]||0), qty=Number(r[4]||0);
    const soldOut=Number.isFinite(qty)&&Number.isFinite(sold)&&qty===sold;
    const promo=r[7]||0;
    const actions=type===2
      ? `<button class="btn btn-highlight" onclick="setPromo(${row},2,this)">Mise en avant</button>`
      : `<button class="btn btn-promo" onclick="setPromo(${row},${type},this)">Promotion</button>`;
    return `<article class="product ${soldOut?'sold-out':''}">
      <div class="product-title">${esc(r[2]||'Produit sans nom')}</div>
      <div class="code">${formatCode(r[3])}</div>
      <div class="facts">
        <div><span>Zone</span><strong>${esc(r[5]||'—')}</strong></div>
        <div><span>Stock</span><strong>${esc(r[4]||'0')}</strong></div>
        <div><span>Vendues</span><strong>${esc(r[6]||'0')}</strong></div>
        <div><span>Promo</span><strong>${esc(promo)} %</strong></div>
      </div>
      <div class="actions">
        <button class="btn btn-sold" onclick="markSold(${row},this)">Vendues totalement</button>
        ${actions}
      </div>
    </article>`;
  }).join('');
}
function renderPage(){
  if(typeof PAGE_TYPE!=='undefined') renderProducts(PAGE_TYPE);
  if(typeof renderHome==='function') renderHome();
  setStatus('Google Sheets connecté.');
}
window.addEventListener('load',()=>{
  updatePageLabels();
  gapiLoaded();
  gisLoaded();
});


const PAGE_TYPE=0;

function updatePageLabels(){
  const s=monthStart(), x=addMonths(s.y,s.m,PAGE_TYPE);
  document.getElementById('monthTitle').textContent =
    monthLabel(x.y,x.m)+' — 50 à 70 %';
}

function showLogin(){
  const box=document.getElementById('googleLogin');
  const btn=document.getElementById('googleLoginBtn');
  if(box) box.style.display='block';
  if(btn) btn.disabled=!(gapiInited && gisInited);
}

function hideLogin(){
  const box=document.getElementById('googleLogin');
  if(box) box.style.display='none';
}

function maybeReady(){
  if(gapiInited && gisInited){
    const btn=document.getElementById('googleLoginBtn');
    if(btn) btn.disabled=false;
    setStatus('Connexion Google prête.');
    // On tente d'abord une reconnexion silencieuse.
    connectGoogleSilent();
  }
}

function connectGoogleSilent(){
  if(!tokenClient || !gapiInited || !gisInited) return;
  setStatus('Connexion à Google Sheets…');
  tokenClient.requestAccessToken({prompt:''});
}

function connectGoogle(){
  if(!tokenClient || !gapiInited || !gisInited){
    setStatus('Google est encore en cours de chargement…');
    return;
  }
  setStatus('Ouverture de la connexion Google…');
  tokenClient.requestAccessToken({prompt:'consent'});
}

async function loadSheet(){
  try{
    const res=await gapi.client.sheets.spreadsheets.values.get({
      spreadsheetId:SPREADSHEET_ID,
      range:RANGE
    });
    sheetRows=res.result.values||[];
    hideLogin();
    renderPage();
    setStatus('Google Sheets connecté.');
  }catch(e){
    showLogin();
    setStatus('Erreur Google Sheets : '+e.message);
  }
}

function renderPage(){
  renderProducts(PAGE_TYPE);
}

window.addEventListener('load',()=>{
  updatePageLabels();
  showLogin();
  gapiLoaded();
  gisLoaded();
});

</script>
</body>
</html>
