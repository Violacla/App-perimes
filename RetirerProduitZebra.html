<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#bcd7ed">

<title>À retirer — Pharmacie du Libron</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<style>
:root{
  --bg:#eaf4fa;--text:#26384d;--muted:#718096;--blue:#5b8fc9;--blue-dark:#3972ad;
  --pink:#d99aae;--pink-dark:#c77991;--pink-soft:#f8e3ea;--blue-soft:#e4f0fa;
  --border:#cbddea;--shadow:0 7px 20px rgba(62,91,122,.12);
  --green:#16834f;--green-soft:#edf9f3
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#dceef8 0%,#bcd7ed 48%,#f8edf1 100%);
  color:var(--text)
}
body{display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100dvh;padding:5px 9px 5px;display:flex;flex-direction:column;min-height:0}

/* Même esthétique que Ajouter un produit */
header{
  height:48px;flex:0 0 48px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border-radius:14px;padding:0;margin-bottom:3px;
  position:relative;text-align:center
}
.brand{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;flex-direction:column}
.logo{width:38px;height:38px;flex:0 0 38px;background:transparent}
.logo img{width:100%;height:100%;object-fit:contain}
.title{min-width:0;text-align:center}
h1{margin:0;font-size:17px;line-height:1;font-weight:900;color:var(--text)}
.sub{font-size:7.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
.operator{
  position:absolute;right:2px;top:7px;text-align:right;
  font-size:8px;color:var(--muted);text-transform:none;letter-spacing:0
}
.operator strong{display:inline;font-size:11px;color:var(--blue-dark);line-height:1;margin-top:0}

/* Le reste conserve exactement l'UX existante, seules les couleurs sont harmonisées */
.back{
  height:27px;flex:0 0 27px;border:1px solid var(--border);border-radius:10px;
  background:rgba(255,255,255,.85);color:var(--text);font-size:10px;font-weight:900;margin-bottom:4px
}
.period{
  height:36px;flex:0 0 36px;padding:0 7px;display:flex;align-items:center;justify-content:space-between
}
.month{font-size:14px;font-weight:900;text-transform:uppercase}
.period small{display:inline;font-size:8px;color:var(--muted);font-weight:800;margin-left:5px}
.rate{
  font-size:10px;font-weight:900;border-radius:9px;padding:5px 8px;
  color:var(--pink-dark);background:var(--pink-soft);border:1px solid var(--pink)
}
.status{font-size:8px;color:var(--blue-dark);text-align:center;height:10px;flex:0 0 10px;margin:0}

#productZone{display:none;flex:1 1 auto;min-height:0;flex-direction:column;overflow:hidden}
.card{
  flex:1 1 auto;min-height:0;
  background:rgba(255,255,255,.92);
  border:1px solid var(--border);border-radius:13px;padding:8px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden
}
.name{font-size:18px;font-weight:900;line-height:1.05;text-transform:uppercase;color:var(--text)}
.meta{font-size:8px;color:var(--muted);margin-top:4px}
.geo{
  margin-top:6px;padding:9px 8px;border-radius:11px;
  background:var(--blue-soft);border:1px solid var(--border);
  color:var(--blue-dark);font-size:14px;font-weight:900;
  text-transform:uppercase;line-height:1.05;text-align:center
}
.line{border-top:1px solid #edf0f2;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
.stat{background:#fff;border:1px solid var(--border);border-radius:9px;padding:5px;text-align:center}
.stat span{display:block;font-size:7px;color:var(--muted);font-weight:800}
.stat b{display:block;font-size:19px;margin-top:2px}
.stat:nth-child(2) b{color:var(--pink-dark)}

.choices{margin-top:6px;flex:0 0 auto}
.choice{
  width:100%;min-height:50px;border:1px solid var(--pink);border-radius:10px;
  padding:6px 8px;display:flex;align-items:center;gap:8px;text-align:left;
  cursor:pointer;background:var(--pink-soft)
}
.choice .box{
  width:25px;height:25px;flex:0 0 25px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;
  border:2px solid var(--pink);color:#fff;background:#fff
}
.choice.checked{background:var(--green-soft);border-color:#bde4d0}
.choice.checked .box{background:var(--green);border-color:#16834f}
.choice.checked .txt{color:var(--green)}
.choice .txt{font-size:10px;font-weight:900;line-height:1.1;color:var(--pink-dark)}
.choice small{display:block;font-size:7px;margin-top:2px;color:var(--muted);font-weight:600}

.next{
  height:42px;flex:0 0 42px;border:0;border-radius:10px;margin-top:5px;
  background:var(--pink);color:#fff;font-size:12px;font-weight:900;cursor:pointer;
  box-shadow:var(--shadow)
}
.next:disabled{background:#d8e0e4;color:#97a4ad}
.bottom{height:13px;flex:0 0 13px;display:flex;justify-content:flex-end;align-items:end}
.ref{font-size:9px;font-weight:900;color:var(--muted)}
.message{text-align:center;font-size:8px;color:var(--pink-dark);height:10px}

.login{flex:1;display:flex;align-items:center;justify-content:center}
.login-card{
  width:100%;border:1px solid var(--border);border-radius:15px;padding:20px 12px;
  text-align:center;box-shadow:var(--shadow);background:rgba(255,255,255,.93)
}
.login-card b{font-size:14px;color:var(--text)}
.login-card p{font-size:9px;color:var(--muted);margin:6px 0 12px}
.google{
  border:0;background:var(--blue-dark);color:#fff;border-radius:10px;height:40px;
  padding:0 18px;font-size:10px;font-weight:900
}
</style>
</head>

<body>

<main class="app">

  <!-- =========================
       HEADER
  ========================== -->
  <header>
    <div class="brand">
      <div class="logo">
        <img src="https://i.imgur.com/AExTPc7.png" alt="Pharmacie du Libron">
      </div>
      <div class="title">
        <h1>À retirer</h1>
        <div class="sub">Produits du mois précédent · Pharmacie du Libron</div>
      </div>
    </div>
    <div class="operator">
      Opérateur
      <strong id="op">—</strong>
    </div>
  </header>

  <!-- =========================
       ACCUEIL
  ========================== -->
  <button class="back" onclick="location.href='ZebraPerimés.html'">
    ← Accueil
  </button>

  <!-- =========================
       MOIS
  ========================== -->
  <section class="period">
    <div>
      <div class="month" id="month">—</div>
      <small>MOIS PRÉCÉDENT</small>
    </div>
    <div class="rate">À RETIRER</div>
  </section>

  <!-- =========================
       STATUT
  ========================== -->
  <div id="status" class="status">
    Préparation de Google Sheets…
  </div>

  <!-- =========================
       CONNEXION GOOGLE
  ========================== -->
  <section id="login" class="login">
    <div class="login-card">
      <b>Connexion Google Sheets</b>
      <p>Appuyez sur le bouton pour autoriser l'accès aux produits.</p>
      <button id="googleBtn" class="google" onclick="connectGoogle()" disabled>
        Préparation…
      </button>
    </div>
  </section>

  <!-- =========================
       PRODUITS
  ========================== -->
  <section id="productZone">
    <div id="card" class="card"></div>
    <button id="next" class="next" disabled onclick="goNext()">
      PRODUIT SUIVANT →
    </button>
    <div class="bottom">
      <div id="ref" class="ref">Référence 0/0</div>
    </div>
    <div id="message" class="message"></div>
  </section>

</main>

<script>
/* ============================================================
   CONFIGURATION GOOGLE
============================================================ */
const CLIENT_ID = '777828681958-d450tqhqunv3thi6k4k0i8t33ts26bcv.apps.googleusercontent.com';
const SPREADSHEET_ID = '1KzO5snEYkAtKjIUm1VHvnAPR8lYjOtwhUQg2dgvjPzE';
const SHEET = 'Feuille2';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

const zebraARetirerResume = 'zebraARetirerResume';

/* ============================================================
   VARIABLES
============================================================ */
let tokenClient = null;
let gapiReady = false;
let gisReady = false;
let products = [];
let idx = 0;
let checked = false;

/* ============================================================
   OPERATEUR
============================================================ */
const operator = localStorage.getItem('zebraOperator') || '—';
document.getElementById('op').textContent = operator;

/* ============================================================
   CALCUL DU MOIS PRECEDENT
============================================================ */
function targetMonth(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth() - 1, 1);
}

/* ============================================================
   CONVERSION DATE
============================================================ */
function dateOf(v){
  if(typeof v === 'number' && isFinite(v)){
    const d = new Date(Date.UTC(1899,11,30) + v * 86400000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), 1);
  }
  const s = String(v ?? '').trim().toLowerCase();
  if(!s){ return null; }

  let m = s.match(/^(\d{4})[-/.](\d{1,2})/);
  if(m){ return new Date(+m[1], +m[2] - 1, 1); }

  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if(m){
    let y = +m[3];
    if(y < 100){ y += 2000; }
    return new Date(y, +m[2] - 1, 1);
  }

  m = s.match(/^(\d{1,2})[-/.](\d{4})$/);
  if(m){ return new Date(+m[2], +m[1] - 1, 1); }

  const d = new Date(s);
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), 1);
}

/* ============================================================
   VERIFICATION DU MOIS
============================================================ */
function target(v){
  const d = dateOf(v);
  const s = targetMonth();
  return (d && d.getFullYear() === s.getFullYear() && d.getMonth() === s.getMonth());
}

/* ============================================================
   SECURITE HTML
============================================================ */
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================================================
   MESSAGES
============================================================ */
function status(t){
  document.getElementById('status').textContent = t;
}

function message(t){
  document.getElementById('message').textContent = t;
}

/* ============================================================
   GOOGLE PRET
============================================================ */
function setReady(){
  const b = document.getElementById('googleBtn');
  b.disabled = false;
  b.textContent = 'Se connecter à Google';
  status('Google Sheets prêt.');
}

/* ============================================================
   ERREUR GOOGLE
============================================================ */
function fail(t){
  status(t);
  const b = document.getElementById('googleBtn');
  b.disabled = true;
  b.textContent = 'Google indisponible';
}

/* ============================================================
   CONNEXION GOOGLE
============================================================ */
function connectGoogle(){
  if(!gisReady || !tokenClient){
    status('Google n’est pas encore prêt…');
    return;
  }
  status('Ouverture de la connexion Google…');
  tokenClient.requestAccessToken({ prompt:'' });
}

/* ============================================================
   INITIALISATION GAPI
============================================================ */
async function bootGapi(){
  try{
    await new Promise((resolve,reject) => {
      gapi.load('client', { callback:resolve, onerror:reject });
    });
    await gapi.client.init({
      discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4']
    });
    gapiReady = true;
    maybeReady();
  }catch(e){
    fail('Impossible de charger Google Sheets : ' + e.message);
  }
}

/* ============================================================
   INITIALISATION GOOGLE IDENTITY
============================================================ */
function bootGIS(){
  try{
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      throw new Error('Google Identity Services non chargé');
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: async response => {
        if(response.error){
          status('Connexion Google refusée : ' + response.error);
          return;
        }
        if(!response.access_token){
          status('Google n’a pas fourni de jeton d’accès.');
          return;
        }
        gapi.client.setToken({ access_token: response.access_token });
        status('Connexion Google réussie. Chargement des produits…');
        await load();
      }
    });
    gisReady = true;
    maybeReady();
  }catch(e){
    fail('Impossible de préparer la connexion Google : ' + e.message);
  }
}

/* ============================================================
   VERIFICATION GOOGLE PRET
============================================================ */
function maybeReady(){
  if(gapiReady && gisReady){
    setReady();
  }
}

/* ============================================================
   SAUVEGARDE DE LA POSITION (REPRISE)
============================================================ */
function saveResume(){
  if(products[idx]){
    localStorage.setItem(zebraARetirerResume, JSON.stringify({
      operator: operator,
      code: String(products[idx].r[3] || '')
    }));
  }
}

/* ============================================================
   AFFICHAGE DU PRODUIT COURANT
============================================================ */
function render(){
  const item = products[idx];
  if(!item) return;
  const r = item.r;
  const stock = Number(r[4]) || 0;
  const oldSold = Number(r[6]) || 0;
  const aRetirer = stock - oldSold;

  document.getElementById('card').innerHTML = `
    <div class="name">${esc(r[2] || 'Produit sans nom')}</div>
    <div class="meta">CIP : ${esc(r[3] || '—')} · Stock : ${stock}</div>
    <div class="geo">📍 ZONE GÉO : ${esc(r[5] || '—')}</div>
    <div class="line"></div>
    <div class="stats">
      <div class="stat"><span>STOCK</span><b>${stock}</b></div>
      <div class="stat"><span>À RETIRER</span><b>${aRetirer}</b></div>
    </div>
    <div class="choices">
      <button type="button" class="choice" id="removeChoice" onclick="toggleCheck()">
        <span class="box" id="removeBox"></span>
        <span class="txt">PRODUIT TOTALEMENT RETIRÉ
          <small>Appuyer ici pour confirmer le retrait</small>
        </span>
      </button>
    </div>
  `;

  checked = false;
  document.getElementById('next').disabled = true;
  document.getElementById('ref').textContent = `Référence ${idx + 1}/${products.length}`;
  saveResume();
}

/* ============================================================
   CHARGEMENT DES PRODUITS
============================================================ */
async function load(){
  try{
    const res = await gapi.client.sheets.spreadsheets.values.get({
      spreadsheetId: SPREADSHEET_ID,
      range: SHEET
    });

    const rows = res.result.values || [];
    products = [];

    rows.slice(1).forEach((r,i) => {
      const stock = Number(r[4]) || 0;
      const oldSold = Number(r[6]) || 0;

      if(target(r[1]) && stock > oldSold){
        products.push({ r, row:i + 2 });
      }
    });

    products.sort((a,b) =>
      (dateOf(a.r[1])?.getTime() || 0) - (dateOf(b.r[1])?.getTime() || 0) || a.row - b.row
    );

    document.getElementById('login').style.display = 'none';
    document.getElementById('productZone').style.display = 'flex';
    idx = 0;

    const saved = JSON.parse(localStorage.getItem(zebraARetirerResume) || 'null');
    if(saved && saved.operator === operator && saved.code){
      const n = products.findIndex(x => String(x.r[3] || '') === String(saved.code));
      if(n >= 0){ idx = n; }
    }

    if(products.length){
      render();
    } else {
      document.getElementById('card').innerHTML = `
        <div style="margin:auto;text-align:center;color:#657484;font-size:12px">
          Tous les produits à retirer du mois sont traités. ✓
        </div>
      `;
      document.getElementById('ref').textContent = 'Référence 0/0';
    }

    message('');

  }catch(e){
    fail('Erreur lors du chargement des produits : ' + (e.result?.error?.message || e.message));
  }
}

/* ============================================================
   COCHER / DECOCHER
============================================================ */
function toggleCheck(){
  checked = !checked;
  const c = document.getElementById('removeChoice');
  const b = document.getElementById('removeBox');
  if(c) c.classList.toggle('checked', checked);
  if(b) b.textContent = checked ? '✓' : '';
  const n = document.getElementById('next');
  if(n) n.disabled = !checked;
}

/* ============================================================
   ECRITURE GOOGLE SHEETS
============================================================ */
async function updateSold(row, value){
  return gapi.client.sheets.spreadsheets.values.update({
    spreadsheetId: SPREADSHEET_ID,
    range: `${SHEET}!G${row}`,
    valueInputOption: 'USER_ENTERED',
    resource:{ values:[[value]] }
  });
}

/* ============================================================
   PASSAGE AU PRODUIT SUIVANT
============================================================ */
async function goNext(){
  if(!checked || !products[idx]){ return; }

  const r = products[idx].r;
  const row = products[idx].row;
  const code = String(r[3] || '');

  document.getElementById('next').disabled = true;
  message('Enregistrement…');

  try{
    const stock = Number(r[4]) || 0;

    await updateSold(row, stock);

    localStorage.removeItem(zebraARetirerResume);
    checked = false;

    await load();

    const n = products.findIndex(x => String(x.r[3] || '') === code);
    idx = n >= 0 ? n : Math.min(idx, Math.max(0, products.length - 1));

    if(products.length){
      render();
      message('');
    } else {
      document.getElementById('card').innerHTML = `
        <div style="margin:auto;text-align:center;color:#657484;font-size:12px">
          Tous les produits à retirer du mois sont traités. ✓
        </div>
      `;
      document.getElementById('ref').textContent = 'Référence 0/0';
      message('');
    }

  }catch(e){
    document.getElementById('next').disabled = false;
    message('Erreur : ' + (e.result?.error?.message || e.message));
  }
}

/* ============================================================
   MOIS
============================================================ */
const months = [
  'janvier','février','mars','avril','mai','juin',
  'juillet','août','septembre','octobre','novembre','décembre'
];

const tm = targetMonth();
document.getElementById('month').textContent = months[tm.getMonth()] + ' ' + tm.getFullYear();

/* ============================================================
   DEMARRAGE GOOGLE
============================================================ */
let gapiStarted = false;
let gisStarted = false;

function waitForGoogle(){
  let tries = 0;
  const timer = setInterval(() => {
    if(!gapiStarted && window.gapi){
      gapiStarted = true;
      bootGapi();
    }
    if(!gisStarted && window.google?.accounts?.oauth2){
      gisStarted = true;
      bootGIS();
    }
    tries++;
    if(gapiReady && gisReady){
      clearInterval(timer);
      return;
    }
    if(tries > 120){
      clearInterval(timer);
      if(!gapiReady || !gisReady){
        fail('Google n’a pas pu être chargé. Vérifiez Internet puis rechargez la page.');
      }
    }
  }, 100);
}

/* ============================================================
   DEMARRAGE
============================================================ */
window.addEventListener('load', waitForGoogle);
</script>

</body>
</html>
