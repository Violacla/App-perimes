<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#bcd7ed">
<title>Zones Géographiques - Pharmacie du Libron</title>
<style>
:root{
  --bg:#bcd7ed;--text:#26384d;--muted:#718096;--blue:#5b8fc9;--blue-dark:#3972ad;
  --pink:#d99aae;--pink-dark:#c77991;--pink-soft:#f8e3ea;--blue-soft:#e4f0fa;
  --border:#cbddea;--shadow:0 4px 12px rgba(62,91,122,.1)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;
 background:#bcd7ed;color:var(--text)}
body{display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:430px;height:100dvh;padding:8px;display:flex;flex-direction:column}

header{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;
 background:#cfe5f4;border:1.5px solid var(--border);border-radius:10px;margin-bottom:6px}
h1{margin:0;font-size:14px;font-weight:900;color:#153d31}

.container{flex:1;background:#ffffff;border:1.5px solid var(--border);border-radius:10px;
 padding:10px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.title{font-size:12px;font-weight:900;color:var(--blue-dark);margin-bottom:8px;text-align:center}

.pastilles-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:6px;overflow-y:auto;padding:2px;flex:1}
.pastille{background:var(--blue-soft);border:1.5px solid var(--border);border-radius:8px;
 padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pastille:hover{background:var(--pink-soft);border-color:var(--pink)}
.pastille-icon{font-size:18px}
.pastille-name{font-size:10px;font-weight:900;color:var(--blue-dark)}
.pastille-shelf{font-size:8px;color:var(--muted);font-weight:700}

.result-box{margin-top:8px;padding:8px;background:var(--blue-soft);border:1.5px solid var(--border);
 border-radius:8px;text-align:center}
.result-box span{font-size:11px;font-weight:900;color:var(--blue-dark)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Plan de l'Officine</h1>
</header>

<div class="container">
  <div class="title">Clique sur une zone pour voir les étagères :</div>
  <div class="pastilles-grid" id="pastilles-container"></div>
  <div class="result-box" id="result">
    <span>Sélection actuelle : Aucune</span>
  </div>
</div>
</div>

<script>
const zoneData = [
  {id: "1", name: "Zone Conseil & Réserve", icon: "📦", shelf: "Réserve 1 et 2"},
  {id: "2", name: "Dermato Yeux & Oreille", icon: "👁️", shelf: "Étagère 8"},
  {id: "3", name: "Vétérinaire", icon: "🐾", shelf: "Espace Vétérinaire"},
  {id: "4", name: "Nature & Phyto", icon: "🌱", shelf: "Arko, Nutergia, Pileje, Aromat, Homéo, Pukka • Étagère 7"},
  {id: "5", name: "Parapharmacie & Dermato", icon: "🧴", shelf: "Bioderma, Cerave, Kreme, La Rosée, SVR, Uriage, LRP, Nuxe, Avene & Coin Acné • Étagère 5"},
  {id: "6", name: "Cheveux, Corps & Déos", icon: "💆", shelf: "Étagères 5 et 7"},
  {id: "7", name: "Hygiène Intime", icon: "🌸", shelf: "Étagère 7"},
  {id: "8", name: "Bébé", icon: "👶", shelf: "Lait bébé • Étagères 3 et 4"},
  {id: "9", name: "Douleurs & Soins", icon: "🩹", shelf: "1ers soins, Pieds/mains, Douleurs • Étagère 8"},
  {id: "10", name: "Bien-être", icon: "✨", shelf: "Étagère 8"}
];

function buildPastillesGrid(){
  const container = document.getElementById('pastilles-container');
  container.innerHTML = '';
  zoneData.forEach(item => {
    const div = document.createElement('div');
    div.className = 'pastille';
    div.innerHTML = `
      <div class="pastille-icon">${item.icon}</div>
      <div class="pastille-name">Zone ${item.id} : ${item.name}</div>
      <div class="pastille-shelf">${item.shelf}</div>
    `;
    div.onclick = () => {
      document.getElementById('result').innerHTML = `<span>Sélection : Zone ${item.id} (${item.name}) → ${item.shelf}</span>`;
    };
    container.appendChild(div);
  });
}

window.addEventListener('load', buildPastillesGrid);
</script>
</body>
</html>
